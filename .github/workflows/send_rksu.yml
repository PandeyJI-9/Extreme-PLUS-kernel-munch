name: 📲 Send Root Manager (PandeyJI-9)

on:
  workflow_dispatch: # Manual trigger button

jobs:
  push_apk_telegram:
    name: "Fetch & Send Manager"
    runs-on: ubuntu-latest

    steps:
      - name: "🔍 Fetch Latest Manager APK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Contacting GitHub API for Manager APK..."
          REPOS=(
            "KOWX712/KernelSU"
            "ReSukiSU/ReSukiSU"
            "rsuntk/KernelSU"
            "tiann/KernelSU"
          )
          APK_URL=""
          VERSION_TAG=""
          for repo in "${REPOS[@]}"; do
            echo "[*] Checking release source: $repo"
            API_URL="https://api.github.com/repos/${repo}/releases"
            DATA=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL")
            FOUND_URL=$(echo "$DATA" | grep "browser_download_url" | grep -i "\.apk" | cut -d '"' -f 4 | head -n 1)
            if [ -n "$FOUND_URL" ]; then
              APK_URL="$FOUND_URL"
              VERSION_TAG=$(echo "$DATA" | grep '"tag_name":' | cut -d '"' -f 4 | head -n 1)
              echo "✅ Located APK in $repo: tag $VERSION_TAG -> $APK_URL"
              break
            fi
          done

          if [ -z "$APK_URL" ]; then
            echo "❌ Failed to locate APK in any release repository!"
            exit 1
          fi

          echo "Downloading version: $VERSION_TAG"
          FILE_NAME="RootManager_${VERSION_TAG}.apk"
          
          curl -fLSs -o "$FILE_NAME" "$APK_URL" || wget -q -O "$FILE_NAME" "$APK_URL"
          
          # Check if file exists and is not empty
          if [ -s "$FILE_NAME" ]; then
            echo "APK_FILE=$FILE_NAME" >> $GITHUB_ENV
            echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
            echo "✅ Download complete: $FILE_NAME"
          else
            echo "❌ Failed to download APK!"
            exit 1
          fi

      - name: "🚀 Send APK to Telegram"
        run: |
          CAPTION="🔥 <b>EXTREME++ Root Manager | Maintainer: PandeyJI-9</b>
          
          📦 <b>Version:</b> <code>${{ env.VERSION_TAG }}</code>
          ⚙️ <b>Type:</b> KowSU / Universal Multi-Manager (Zero-Failure App Profile)
          📱 <b>Device:</b> POCO F4 (munch)
          
          ⬇️ <i>Install this manager to control your root access. Seamlessly synced with EXTREME++ KowSU engine with 100% root grant support!</i>"
          
          echo "[*] Uploading APK to Telegram..."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document="@${{ env.APK_FILE }}" \
            -F caption="$CAPTION" \
            -F parse_mode="HTML"
          
          echo "[+] Successfully pushed to Telegram!"
