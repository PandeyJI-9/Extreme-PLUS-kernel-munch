      - name: "🔍 Fetch Latest ReSukiSU Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Contacting GitHub API..."
          # Fetch all releases (including pre-releases) instead of just 'latest'
          API_URL="https://api.github.com/repos/ReSukiSU/ReSukiSU/releases"
          
          # Extract exact APK URL and Version using jq
          APK_URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" $API_URL | jq -r '.[0].assets[]? | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          VERSION_TAG=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" $API_URL | jq -r '.[0].tag_name')
          
          # Failsafe Fallback: Agar ReSukiSU manager unke repo me direct nahi hai
          if [ -z "$APK_URL" ] || [ "$APK_URL" == "null" ]; then
            echo "[!] ReSukiSU direct APK missing. Triggering fallback to rsuntk..."
            API_URL="https://api.github.com/repos/rsuntk/KernelSU/releases"
            APK_URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" $API_URL | jq -r '.[0].assets[]? | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
            VERSION_TAG=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" $API_URL | jq -r '.[0].tag_name')
          fi
          
          echo "Downloading version: $VERSION_TAG"
          FILE_NAME="ReSukiSU_Manager_${VERSION_TAG}.apk"
          
          wget -q -O "$FILE_NAME" "$APK_URL"
          
          # Check if file exists AND is not empty (-s)
          if [ -s "$FILE_NAME" ]; then
            echo "APK_FILE=$FILE_NAME" >> $GITHUB_ENV
            echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
            echo "✅ Download complete: $FILE_NAME"
          else
            echo "❌ Failed to download APK! Check API or URL."
            exit 1
          fi
