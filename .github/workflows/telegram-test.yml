name: "🚀 Telegram Bot Stress Test"

on:
  workflow_dispatch:

jobs:
  spam-test:
    name: "Spamming Telegram"
    runs-on: ubuntu-latest
    
    steps:
      - name: "🚀 Start Telegram Spam Test (1 Minute)"
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ Bot Token gayab hai! GitHub Secrets check kar."
            exit 1
          fi

          echo "🚀 Testing bot server... No spamming 😂"
          
          # Hardcoded Chat ID as you requested
          CHAT_ID="-5168285620"
          
          end_time=$((SECONDS + 60))
          counter=1

          while [ $SECONDS -lt $end_time ]; do
            TEXT="Testing bot server only no spamming 😂 (Message #$counter)"
            
            # Removed > /dev/null so you can see exact Telegram errors in GitHub logs!
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" -d text="${TEXT}"
              
            echo "Sent message #$counter"
            counter=$((counter+1))
            
            sleep 1.5
          done
          
          echo "✅ Test Complete!"
