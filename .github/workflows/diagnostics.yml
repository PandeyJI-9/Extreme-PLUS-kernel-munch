# ╔══════════════════════════════════════════════════════════════╗
# ║  EXTREME++HyperOS — STANDALONE DIAGNOSTICS                   ║
# ║  Auto-fetches the LATEST release & runs deep binary audit    ║
# ╚══════════════════════════════════════════════════════════════╝
name: "☣️ Diagnostics & Audit"

on:
  workflow_dispatch:
    # No inputs required! Yeh automatically latest release uthayega.

permissions:
  contents: read

jobs:
  audit:
    name: "Deep Binary Audit"
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: "🛠️ Install diagnostic tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget unzip device-tree-compiler bc binutils jq gh

      - name: "📥 Auto-Fetch Latest ZIP"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Automatically GitHub API se latest release ka tag nikalo
          LATEST_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          echo "Latest release detected: $LATEST_TAG"
          echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_ENV
          
          mkdir -p release_dl
          gh release download "$LATEST_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir release_dl

          ZIP_FILE=$(find release_dl -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ERROR: No ZIP found in latest release ($LATEST_TAG)"
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Found ZIP: $ZIP_FILE"

      - name: "🔬 Deep Binary Audit"
        run: |
          mkdir -p audit_extract
          unzip -o "$ZIP_FILE" -d audit_extract > /dev/null

          # 1. Kernel Image Setup
          if [ -f audit_extract/Image ]; then
            KERNEL_BIN="audit_extract/Image"
          elif [ -f audit_extract/Image.gz ]; then
            gunzip -k audit_extract/Image.gz
            KERNEL_BIN="audit_extract/Image"
          else
            echo "❌ Kernel Image MISSING!"
            exit 1
          fi
          
          # 2. Deep Root (SukiSU) & KPROBES Scan
          echo "Scanning binary for SukiSU..."
          if strings "$KERNEL_BIN" | grep -qi "kernelsu"; then
            echo "ROOT_STATUS=✅ Verified In-Binary (SukiSU)" >> $GITHUB_ENV
          else
            echo "ROOT_STATUS=❌ Missing in Binary" >> $GITHUB_ENV
          fi

          echo "Scanning binary for KProbes..."
          if strings "$KERNEL_BIN" | grep -qi "kprobe"; then
            echo "KPROBE_STATUS=✅ Active" >> $GITHUB_ENV
          else
            echo "KPROBE_STATUS=❌ Missing" >> $GITHUB_ENV
          fi

          # 3. DTB Check (CPU/GPU Frequencies)
          if [ -f audit_extract/dtb ]; then
            # Try decompiling to ensure it's valid
            dtc -I dtb -O dts audit_extract/dtb > audit_extract/decompiled.dts 2>/dev/null || true
            if [ -f audit_extract/decompiled.dts ]; then
              echo "DTB_STATUS=✅ Packed & Decompiled" >> $GITHUB_ENV
            else
              echo "DTB_STATUS=⚠️ Packed but failed to decompile" >> $GITHUB_ENV
            fi
          else
            echo "DTB_STATUS=❌ Missing (Frequencies failed)" >> $GITHUB_ENV
          fi

          # 4. DTBO Check
          if [ -f audit_extract/dtbo.img ]; then
            echo "DTBO_STATUS=✅ Present" >> $GITHUB_ENV
          else
            echo "DTBO_STATUS=❌ Missing" >> $GITHUB_ENV
          fi

          # 5. AnyKernel Branding
          if grep -q "Extreme Plus Gaming On Hyper os" audit_extract/anykernel.sh; then
            echo "BRAND_STATUS=✅ Verified" >> $GITHUB_ENV
          else
            echo "BRAND_STATUS=❌ Wrong Branding" >> $GITHUB_ENV
          fi

      - name: "📢 Telegram: Deep Report"
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ] && exit 0
          
          # Fallback values if script crashed mid-way
          ROOT_STATUS="${ROOT_STATUS:-❌ Audit Failed}"
          KPROBE_STATUS="${KPROBE_STATUS:-❌ Audit Failed}"
          DTB_STATUS="${DTB_STATUS:-❌ Audit Failed}"
          DTBO_STATUS="${DTBO_STATUS:-❌ Audit Failed}"
          BRAND_STATUS="${BRAND_STATUS:-❌ Audit Failed}"
          
          if [ "${{ job.status }}" = "success" ]; then
            VERDICT="SAFE TO FLASH 🚀"
          else
            VERDICT="DANGER / CORRUPTED ⚠️"
          fi
          
          TEXT=$(cat << EOF
          ☣️ <b>EXTREME++ DEEP AUDIT REPORT</b>
          🏷 Tag: <code>${RELEASE_TAG:-Unknown}</code>

          <b>🔬 Binary Scan Results:</b>
          🔑 Root (SukiSU): ${ROOT_STATUS}
          🪝 KProbes (Root Mount): ${KPROBE_STATUS}
          🌲 Main DTB (CPU/GPU): ${DTB_STATUS}
          🖥️ DTBO Image: ${DTBO_STATUS}
          🏷️ Branding: ${BRAND_STATUS}

          🏆 <b>Verdict:</b> ${VERDICT}
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
            -d text="${TEXT}"
