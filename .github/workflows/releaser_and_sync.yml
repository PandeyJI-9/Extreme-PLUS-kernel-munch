# ============================================================
# Extreme-PLUS Kernel — releaser_and_sync.yml
# Auto: pull upstream fixes → inject rKSU → build → Release
# ============================================================
name: "🚀 Release + Upstream Sync"

on:
  schedule:
    # Run every Sunday at 02:00 UTC for weekly upstream sync
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2-weekly)"
        required: true
        default: "v1.0-zero-heat"
      inject_ksu:
        description: "Inject KernelSU?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      force_release:
        description: "Force release even if no upstream changes?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

env:
  KERNEL_REPO:    "https://github.com/AstideLabs/android_kernel_xiaomi_sm8250"
  KERNEL_BRANCH:  "android17-aptusitu"
  DEFCONFIG:      "munch_defconfig"
  CLANG_DIR:      "${{ github.workspace }}/proton-clang"
  KERNEL_OUT:     "${{ github.workspace }}/kernel_out"
  AK3_DIR:        "${{ github.workspace }}/AnyKernel3"
  ZIP_OUT:        "${{ github.workspace }}/release"

jobs:
  sync-build-release:
    name: "Sync → Build → Release"
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      # ── 0. Checkout ──────────────────────────────────────────────────
      - name: "📦 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: build-repo

      # ── 1. Dependencies ───────────────────────────────────────────────
      - name: "🛠️ Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            libelf-dev libssl-dev lld llvm python3 wget zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            device-tree-compiler gh

      # ── 2. Clang (cached) ─────────────────────────────────────────────
      - name: "⚡ Restore Proton Clang cache"
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: proton-clang-v1

      - name: "⚡ Download Clang (if not cached)"
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.CLANG_DIR }}"
          wget -qO /tmp/clang.tar.gz \
            "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz"
          tar -xzf /tmp/clang.tar.gz --strip-components=1 -C "${{ env.CLANG_DIR }}"

      # ── 3. Fetch upstream kernel ──────────────────────────────────────
      - name: "🌐 Fetch upstream kernel source"
        run: |
          git clone --depth=1 --branch "${{ env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" kernel_src

          # Record upstream HEAD SHA for release notes
          UPSTREAM_SHA=$(git -C kernel_src rev-parse --short HEAD)
          echo "UPSTREAM_SHA=${UPSTREAM_SHA}" >> $GITHUB_ENV
          echo "Upstream HEAD: ${UPSTREAM_SHA}"

      # ── 4. Check if upstream changed since last build ─────────────────
      - name: "🔄 Check upstream delta"
        id: upstream-check
        run: |
          CURRENT_SHA=$(git -C kernel_src rev-parse HEAD)
          LAST_SHA_FILE="build-repo/.last_upstream_sha"

          if [ -f "$LAST_SHA_FILE" ]; then
            LAST_SHA=$(cat "$LAST_SHA_FILE")
            if [ "$CURRENT_SHA" = "$LAST_SHA" ] && \
               [ "${{ github.event.inputs.force_release }}" != "true" ]; then
              echo "No upstream changes detected. Skipping build."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "Changes detected: $LAST_SHA → $CURRENT_SHA"
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "First run — building unconditionally"
          fi

          # Save new SHA for next run
          echo "$CURRENT_SHA" > /tmp/new_upstream_sha

      # ── 5. Inject rKSU ───────────────────────────────────────────────
      - name: "🔑 Inject rKSU (KernelSU)"
        if: |
          steps.upstream-check.outputs.skip != 'true' &&
          (github.event.inputs.inject_ksu == 'true' || github.event_name == 'schedule')
        working-directory: kernel_src
        run: |
          echo "=== Injecting KernelSU (rKSU) ==="
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s main
          echo "KSU_INJECTED=true" >> $GITHUB_ENV
          echo "✅ rKSU injected"

      # ── 6. Apply GPU 150MHz patch ─────────────────────────────────────
      - name: "🎮 PATCH: GPU 150MHz idle OPP"
        if: steps.upstream-check.outputs.skip != 'true'
        working-directory: kernel_src
        run: |
          GPU_DTSI="arch/arm64/boot/dts/vendor/qcom/kona-gpu.dtsi"
          python3 - "$GPU_DTSI" << 'PYEOF'
          import sys
          path = sys.argv[1]
          text = open(path).read()
          if '150000000' in text:
              print("Already patched")
              sys.exit(0)
          marker = '\t\topp-290000000 {'
          if marker not in text:
              print("ERROR: gpu marker not found", file=sys.stderr)
              sys.exit(1)
          new_opp = (
              "\n\t\topp-150000000 {\n"
              "\t\t\topp-hz = /bits/ 64 <150000000>;\n"
              "\t\t\topp-microvolt = <RPMH_REGULATOR_LEVEL_MIN_SVS>;\n"
              "\t\t};\n\n"
          )
          open(path, 'w').write(text.replace(marker, new_opp + marker, 1))
          print("✅ 150MHz GPU OPP inserted")
          PYEOF

      # ── 7. Apply CPU 3.0GHz cap ───────────────────────────────────────
      - name: "🏎️ PATCH: CPU Prime Core 3.0GHz cap"
        if: steps.upstream-check.outputs.skip != 'true'
        working-directory: kernel_src
        run: |
          CPU_DTSI="arch/arm64/boot/dts/vendor/qcom/kona.dtsi"
          python3 - "$CPU_DTSI" << 'PYEOF'
          import sys
          path = sys.argv[1]
          text = open(path).read()
          if 'qcom,freq-domain-max-freq' in text:
              print("Already patched")
              sys.exit(0)
          for marker in ['\t\t\t#freq-domain-cells = <2>;', '\t\t\tqcom,skip-enable-check;']:
              if marker in text:
                  new_text = text.replace(marker,
                      '\t\t\t/* Extreme-PLUS: Cap Prime to 3.0GHz */\n'
                      '\t\t\tqcom,freq-domain-max-freq = <0 0 3000000>;\n\n' + marker, 1)
                  open(path, 'w').write(new_text)
                  print("✅ CPU Prime cap applied")
                  sys.exit(0)
          print("ERROR: cpu marker not found", file=sys.stderr)
          sys.exit(1)
          PYEOF

      # ── 8. Build ──────────────────────────────────────────────────────
      - name: "🔨 Full kernel build"
        if: steps.upstream-check.outputs.skip != 'true'
        working-directory: kernel_src
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          mkdir -p "${{ env.KERNEL_OUT }}"

          # defconfig
          make O="${{ env.KERNEL_OUT }}" ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            "${{ env.DEFCONFIG }}"

          # Full build
          make -j$(nproc) O="${{ env.KERNEL_OUT }}" ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            Image.gz dtbs modules 2>&1 | tee /tmp/build.log

          echo "✅ Build complete"

      # ── 9. Package ZIP ────────────────────────────────────────────────
      - name: "🗜️ Package flashable ZIP"
        if: steps.upstream-check.outputs.skip != 'true'
        run: |
          mkdir -p "${{ env.ZIP_OUT }}"
          git clone --depth=1 \
            "https://github.com/osm0sis/AnyKernel3" "${{ env.AK3_DIR }}"

          cat > "${{ env.AK3_DIR }}/anykernel.sh" << 'AK3EOF'
          properties() { '
          kernel.string=Extreme-PLUS Zero-Heat Kernel by PandeyJI-9
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          device.name1=munch
          device.name2=POCO F4
          supported.versions=12-15
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          . tools/ak3-core.sh;
          flash_generic_dtb;
          write_boot;
          AK3EOF

          cp "${{ env.KERNEL_OUT }}/arch/arm64/boot/Image.gz" \
             "${{ env.AK3_DIR }}/Image.gz"

          # DTBO
          DTBO=$(find "${{ env.KERNEL_OUT }}/arch/arm64/boot/dts" \
            -name "munch*.dtbo" 2>/dev/null | head -1)
          [ -f "$DTBO" ] && cp "$DTBO" "${{ env.AK3_DIR }}/dtbo.img"

          # Name
          BUILD_DATE=$(date -u +"%Y%m%d")
          TAG="${{ github.event.inputs.tag }}"
          KSU_TAG=""
          [ "${KSU_INJECTED:-false}" = "true" ] && KSU_TAG="-KSU"
          ZIP_NAME="Extreme-PLUS-ZeroHeat-munch-${TAG}-${BUILD_DATE}${KSU_TAG}.zip"

          cd "${{ env.AK3_DIR }}"
          zip -r9 "${{ env.ZIP_OUT }}/${ZIP_NAME}" . -x "*.git*"

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "ZIP_PATH=${{ env.ZIP_OUT }}/${ZIP_NAME}" >> $GITHUB_ENV
          ls -lh "${{ env.ZIP_OUT }}/${ZIP_NAME}"

      # ── 10. Create GitHub Release ─────────────────────────────────────
      - name: "🚀 Create GitHub Release"
        if: steps.upstream-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          KSU_NOTE=""
          [ "${KSU_INJECTED:-false}" = "true" ] && \
            KSU_NOTE="🔑 **KernelSU (rKSU)** injected — supports Magisk-compatible root"

          gh release create "$TAG" \
            "${{ env.ZIP_PATH }}" \
            --repo "${{ github.repository }}" \
            --title "Extreme-PLUS Zero-Heat ${TAG} | munch/POCO F4" \
            --notes "## 🌡️ Extreme-PLUS Zero-Heat Kernel

          **Device:** POCO F4 (munch) | SM8250 | Adreno 650
          **Upstream SHA:** \`${{ env.UPSTREAM_SHA }}\`

          ${KSU_NOTE}

          ### Tuning — Zero-Heat Profile
          | Component | Stock | Patched | Why |
          |-----------|-------|---------|-----|
          | GPU Min Freq | 290MHz | **150MHz** | -30% idle GPU power |
          | GPU Voltage @ 150MHz | — | MIN_SVS | Safe for A650 silicon |
          | CPU7 (Prime) Max | 3.187GHz | **3.0GHz** | -10% peak heat, no lag |
          | CPU4-6 (Gold) | Stock | Stock | No change |
          | CPU0-3 (Silver) | Stock | Stock | No change |
          | Display (60/90/120Hz) | Stock | Stock | HyperOS 3 compatible |
          | Haptics / Sensors | Stock | Stock | No regression |
          | Battery charging | Stock | Stock | No regression |

          ### Flash
          TWRP/OrangeFox → Flash ZIP → Wipe Dalvik → Reboot"
          echo "✅ Release created"

      # ── 11. Commit updated SHA ────────────────────────────────────────
      - name: "💾 Save upstream SHA for next run"
        if: steps.upstream-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cp /tmp/new_upstream_sha build-repo/.last_upstream_sha
          cd build-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_upstream_sha
          git diff --staged --quiet || \
            git commit -m "ci: update upstream SHA to ${{ env.UPSTREAM_SHA }}"
          git push || echo "⚠️ Push failed (no changes or permission denied)"

      - name: "⏭️ Skipped (no upstream changes)"
        if: steps.upstream-check.outputs.skip == 'true'
        run: |
          echo "No upstream changes — skipping build & release."
          echo "Use 'force_release: true' to override."
