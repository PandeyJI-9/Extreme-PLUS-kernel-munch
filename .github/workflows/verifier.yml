# ════════════════════════════════════════════════════════════
#  EXTREME++GAMING — Verify compiled DT patches
#  MANUAL DISPATCH ONLY
# ════════════════════════════════════════════════════════════
name: "🔍 Verify Compiled DT Patches"

on:
  workflow_dispatch:

env:
  KERNEL_REPO:   "https://github.com/AstideLabs/android_kernel_xiaomi_sm8250"
  KERNEL_BRANCH: "android17-aptusitu"
  DEFCONFIG:     "munch_defconfig"
  CLANG_DIR:     "${{ github.workspace }}/proton-clang"

jobs:
  verify:
    name: "Verify GPU 670MHz + 150MHz + CPU 3.0GHz"
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v4

      - name: "🛠️ Install deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex git libelf-dev libssl-dev \
            lld llvm python3 wget gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu device-tree-compiler

      - name: "⚡ Restore Clang cache"
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: proton-clang-v2

      - name: "⚡ Download Clang"
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.CLANG_DIR }}"
          wget -qO /tmp/clang.tar.gz \
            "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz"
          tar -xzf /tmp/clang.tar.gz --strip-components=1 -C "${{ env.CLANG_DIR }}"

      - name: "🌐 Fetch kernel source"
        run: |
          git clone --depth=1 --branch "${{ env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" kernel_src

      - name: "🩹 Apply patches"
        run: |
          chmod +x patches/apply-all.sh
          bash patches/apply-all.sh kernel_src

      - name: "⚙️ make defconfig + dtbs"
        working-directory: kernel_src
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          mkdir -p kout
          make O=kout ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld "${{ env.DEFCONFIG }}"
          make -j$(nproc) O=kout ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld dtbs

      # ── VERIFY GPU ──────────────────────────────────────────
      - name: "🔍 VERIFY: GPU frequencies in patched DTSI"
        run: |
          GPU_DTSI="kernel_src/arch/arm64/boot/dts/vendor/qcom/kona-gpu.dtsi"
          echo "=== GPU OPP Table Verification ==="

          PASS=true

          # Must have all 10 frequencies
          for freq in 670000000 587000000 525000000 490000000 \
                      441000000 400000000 305000000 250000000 \
                      200000000 150000000; do
            if grep -q "$freq" "$GPU_DTSI"; then
              echo "  ✅ ${freq} Hz found"
            else
              echo "  ❌ ${freq} Hz MISSING"
              PASS=false
            fi
          done

          # Must NOT have old stock frequencies
          for old in 480000000 381000000 290000000; do
            if grep -q "opp-${old}" "$GPU_DTSI"; then
              echo "  ❌ Old stock freq ${old} still present!"
              PASS=false
            else
              echo "  ✅ Old ${old} correctly removed"
            fi
          done

          $PASS || exit 1
          echo "✅ GPU verification PASSED"

      # ── VERIFY CPU ──────────────────────────────────────────
      - name: "🔍 VERIFY: CPU Prime Core 3.0GHz cap"
        run: |
          CPU_DTSI="kernel_src/arch/arm64/boot/dts/vendor/qcom/kona.dtsi"
          echo "=== CPU Verification ==="

          if grep -q "freq-domain-max-freq" "$CPU_DTSI"; then
            echo "  ✅ freq-domain-max-freq property found"
          else
            echo "  ❌ freq-domain-max-freq NOT found"
            exit 1
          fi

          VAL=$(grep "freq-domain-max-freq" "$CPU_DTSI" \
            | grep -o '[0-9]*' | tail -1)
          if [ "$VAL" = "3000000" ]; then
            echo "  ✅ Prime Core max = ${VAL} kHz = 3.0 GHz EXACT"
          else
            echo "  ❌ Expected 3000000, got: ${VAL}"
            exit 1
          fi
          echo "✅ CPU verification PASSED"

      # ── VERIFY KERNEL NAME ──────────────────────────────────
      - name: "🔍 VERIFY: Kernel name"
        run: |
          DEFCONF="kernel_src/arch/arm64/configs/munch_defconfig"
          if grep -q 'EXTREME++GAMING' "$DEFCONF"; then
            echo "✅ Kernel name: EXTREME++GAMING"
          else
            echo "❌ Kernel name not set"
            exit 1
          fi

      - name: "📊 Summary"
        run: |
          echo "════════════════════════════════════════"
          echo "  VERIFICATION PASSED — EXTREME++GAMING"
          echo "════════════════════════════════════════"
          echo "  ✅ GPU: 10 OPPs (150–670 MHz)"
          echo "  ✅ CPU: Prime Core → 3.0 GHz"
          echo "  ✅ Name: EXTREME++GAMING"
          echo "  ℹ️  Display / Haptics / Sensors: STOCK"
          echo "════════════════════════════════════════"
