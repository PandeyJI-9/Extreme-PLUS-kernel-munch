name: 📜 Auto-Generate & Post Changelog

on:
  workflow_dispatch:
    inputs:
      notify:
        description: 'Send to Telegram?'
        required: false
        type: boolean
        default: true

jobs:
  update_changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Build Pro Developer Changelog
        run: |
          chmod +x patches/update_changelog.py
          python3 patches/update_changelog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Push Changelog to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add EXTREME_Changelog.txt
          git commit -m "📝 docs: Auto-updated EXTREME++ changelog" || echo "No changes to commit"
          git push || echo "Already up to date"

      - name: 📲 Send Changelog to Telegram
        if: ${{ github.event.inputs.notify != 'false' }}
        run: |
          chmod +x patches/send_telegram_changelog.py
          python3 patches/send_telegram_changelog.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
