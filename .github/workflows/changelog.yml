name: 📜 Auto-Generate & Post Changelog

on:
  workflow_dispatch: # Manual trigger

jobs:
  update_changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Build Pro Developer Changelog
        id: build_log
        run: |
          CHANGELOG_FILE="EXTREME_Changelog.txt"
          TEMP_FILE="temp_log.txt"
          CURRENT_DATE=$(date +"%d/%m/%Y")
          
          # 1. Pro Header Injection (Username updated)
          echo "Kernel Specific Changes:" > $TEMP_FILE
          echo "Build type: EXTREME++ Stable / Performance" >> $TEMP_FILE
          echo "Device name: POCO F4" >> $TEMP_FILE
          echo "Device codename: munch" >> $TEMP_FILE
          echo "Kernel maintainer: @pandey_ji_8" >> $TEMP_FILE
          echo "" >> $TEMP_FILE
          
          # 2. Date Divider
          echo "==========${CURRENT_DATE}==========" >> $TEMP_FILE
          
          # 3. Smart Git Commits Scan (Kachra Filter)
          # Ye line 30 commits uthayegi, usme se 'changelog.yml' aur 'Auto-updated' ko delete karegi, aur bache hue top 10 asli commits legi
          COMMITS=$(git log -n 30 --no-merges --pretty=format:"* %s" | grep -v -i "changelog.yml" | grep -v "Auto-updated EXTREME" | head -n 10)
          
          # Agar koi asli commit nahi bacha, toh default message daal do
          if [ -z "$COMMITS" ]; then
            COMMITS="* Synced with latest kernel sources and improvements."
          fi
          
          echo "$COMMITS" >> $TEMP_FILE
          echo "" >> $TEMP_FILE
          echo "" >> $TEMP_FILE
          
          # Telegram Env Variable
          echo "TG_COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # 4. History Retention
          if [ -f "$CHANGELOG_FILE" ]; then
            tail -n +7 "$CHANGELOG_FILE" >> $TEMP_FILE
          fi
          
          # 5. Final Output
          mv $TEMP_FILE $CHANGELOG_FILE
          echo "✅ EXTREME++ Changelog created successfully!"

      - name: 🚀 Push Changelog to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add EXTREME_Changelog.txt
          
          git commit -m "📝 docs: Auto-updated EXTREME++ changelog" || echo "No changes to commit"
          git push

      - name: 📲 Send Changelog to Telegram
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          CHANGELOG_LINK="${REPO_URL}/blob/main/EXTREME_Changelog.txt"
          
          # Direct URLs use kiye hain taaki hide na ho
          CAPTION="🔥 <b>EXTREME++ Kernel Update Changelog</b>
          
          🗓 <b>Date:</b> $(date +"%d/%m/%Y")
          👤 <b>Maintainer:</b> @pandey_ji_8
          📱 <b>Device:</b> POCO F4 (munch)
          
          🛠 <b>Latest Changes:</b>
          ${{ env.TG_COMMITS }}
          
          ━━━━━━━━━━━━━━━━━━
          🔗 <b>Full Changelog History:</b>
          ${CHANGELOG_LINK}"
          
          echo "[*] Sending Changelog to Telegram..."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$CAPTION" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true"
            
          echo "[+] Telegram broadcast successful!"
