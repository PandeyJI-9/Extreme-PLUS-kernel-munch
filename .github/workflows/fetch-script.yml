name: "🕵️ Fetch Dev Script (Telegram DM)"

on:
  workflow_dispatch:

jobs:
  fetch-script:
    name: "Steal build_kernel.sh"
    runs-on: ubuntu-latest
    
    steps:
      - name: "🌐 Clone AstideLabs Kernel"
        # Sirf source code clone kar rahe hain, build nahi karenge
        run: git clone --depth=1 --branch android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel

      - name: "📤 Send build_kernel.sh to Telegram DM"
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$DM_CHAT_ID" ]; then
            echo "❌ Bot Token ya TELEGRAM_DM_ID gayab hai! GitHub Secrets check kar."
            exit 1
          fi
          
          if [ -f "kernel/build_kernel.sh" ]; then
            echo "File mil gayi! Telegram pe bhej raha hu..."
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${DM_CHAT_ID}" \
              -F document=@"kernel/build_kernel.sh" \
              -F caption="🕵️ Bhai, ye le AstideLabs ka original build_kernel.sh file!"
            echo "✅ File successfully sent to your DM!"
          else
            echo "❌ ERROR: build_kernel.sh file us repo me nahi mili!"
            exit 1
          fi
