# ============================================================
# Extreme-PLUS Kernel — builder.yml
# Project Zero-Heat | POCO F4 (munch) | SM8250
# Maintainer: PandeyJI-9
# ============================================================
#
# TUNING SUMMARY:
#   GPU (Adreno 650): Adds 150MHz idle OPP at MIN_SVS voltage
#                     → Saves battery during idle / UI scroll
#   CPU (Kryo 585):   Caps Prime Core (CPU7) to 3.0GHz
#                     → Reduces heat on sustained workloads
#
# All other cores, display, haptics, sensors, charging: STOCK
# ============================================================

name: "🔨 Build Extreme-PLUS Kernel"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0-zero-heat)"
        required: false
        default: ""
      enable_ksu:
        description: "Inject KernelSU (rKSU)?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# ─────────────────────────────────────────────
# Environment — edit only these lines normally
# ─────────────────────────────────────────────
env:
  KERNEL_REPO:    "https://github.com/AstideLabs/android_kernel_xiaomi_sm8250"
  KERNEL_BRANCH:  "android17-aptusitu"
  DEVICE_CODENAME: "munch"
  DEFCONFIG:      "munch_defconfig"

  # Proton Clang — latest known good release
  CLANG_URL:      "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz"
  CLANG_DIR:      "${{ github.workspace }}/proton-clang"

  # AnyKernel3 — mkbootimg-free, flashable zip packer
  AK3_REPO:       "https://github.com/osm0sis/AnyKernel3"
  AK3_BRANCH:     "master"

  # Toolchain identifiers (used in Makefile cross-compile)
  CROSS_COMPILE:        "aarch64-linux-gnu-"
  CROSS_COMPILE_COMPAT: "arm-linux-gnueabi-"

  # Output paths
  KERNEL_OUT:   "${{ github.workspace }}/kernel_out"
  AK3_DIR:      "${{ github.workspace }}/AnyKernel3"
  ZIP_OUT:      "${{ github.workspace }}/release"

jobs:
  build:
    name: "Build munch kernel"
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ── 0. Checkout this repo (for patch files) ──────────────────────
      - name: "📦 Checkout build repo"
        uses: actions/checkout@v4
        with:
          path: build-repo

      # ── 1. Install build dependencies ────────────────────────────────
      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl \
            flex git gnupg libelf-dev libssl-dev lld llvm \
            python3 python3-pip tar wget zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            libncurses-dev cpio rsync
          echo "✅ Dependencies installed"

      # ── 2. Fetch Proton Clang ─────────────────────────────────────────
      - name: "⚡ Fetch Proton Clang"
        run: |
          mkdir -p "${{ env.CLANG_DIR }}"
          # Try pre-built release first; fall back to master tarball
          CLANG_RELEASE_URL="https://github.com/kdrag0n/proton-clang/releases/download/20210522/proton-clang-20210522.tar.zst"
          if wget --spider "$CLANG_RELEASE_URL" 2>/dev/null; then
            wget -qO /tmp/clang.tar.zst "$CLANG_RELEASE_URL"
            tar --use-compress-program=unzstd -xf /tmp/clang.tar.zst \
                --strip-components=1 -C "${{ env.CLANG_DIR }}"
          else
            echo "Falling back to master tarball..."
            wget -qO /tmp/clang.tar.gz "${{ env.CLANG_URL }}"
            tar -xzf /tmp/clang.tar.gz --strip-components=1 -C "${{ env.CLANG_DIR }}"
          fi
          echo "PATH=${{ env.CLANG_DIR }}/bin:$PATH" >> $GITHUB_ENV
          echo "✅ Proton Clang ready: $(ls ${{ env.CLANG_DIR }}/bin/clang* | head -1)"

      # ── 3. Fetch kernel source (shallow, no history) ─────────────────
      - name: "🌐 Fetch AstideLabs kernel source"
        run: |
          git clone \
            --depth=1 \
            --branch "${{ env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" \
            kernel_src
          echo "✅ Source at: $(du -sh kernel_src | cut -f1)"

      # ── 4. Inject KernelSU (rKSU) — optional ─────────────────────────
      - name: "🔑 Inject KernelSU (rKSU)"
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel_src
        run: |
          echo "Injecting rKSU into kernel..."
          # Add KSU as git submodule inline (no fork required)
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          echo "✅ KernelSU injected"

      # ── 5a. PATCH: GPU — Add 150MHz idle OPP ─────────────────────────
      #
      # FILE: arch/arm64/boot/dts/vendor/qcom/kona-gpu.dtsi
      #
      # The Adreno 650 OPP table (gpu_opp_table) currently bottoms out
      # at 290MHz (LOW_SVS).  We insert a new 150MHz entry at MIN_SVS
      # voltage.  This lets the GPU governor drop to 150MHz during idle,
      # UI scrolling, and light workloads → big battery win.
      #
      # Voltage level: RPMH_REGULATOR_LEVEL_MIN_SVS (value = 48)
      # This is the lowest safe voltage for Adreno 650 silicon per
      # Qualcomm's published power data.
      #
      # We also update qcom,initial-pwrlevel from 2 → 3 so the driver
      # knows 4 power levels now exist (index 0 = highest).
      # ─────────────────────────────────────────────────────────────────
      - name: "🎮 PATCH: GPU — Insert 150MHz idle OPP"
        working-directory: kernel_src
        run: |
          GPU_DTSI="arch/arm64/boot/dts/vendor/qcom/kona-gpu.dtsi"

          echo "=== Original gpu_opp_table (before patch) ==="
          grep -n "opp-" "$GPU_DTSI" || true

          # ── Insert 150MHz OPP entry right after the opening brace
          #    of gpu_opp_table (before opp-480000000)
          #    Pattern: "compatible = \"operating-points-v2\";"
          python3 - "$GPU_DTSI" << 'PYEOF'
          import sys, re

          path = sys.argv[1]
          text = open(path).read()

          NEW_OPP = """
          \topp-150000000 {
          \t\topp-hz = /bits/ 64 <150000000>;
          \t\topp-microvolt = <RPMH_REGULATOR_LEVEL_MIN_SVS>;
          \t};

          """

          # Insert before opp-290000000 (current lowest)
          marker = '\t\topp-290000000 {'
          if '150000000' in text:
              print("150MHz OPP already present — skipping")
              sys.exit(0)
          if marker not in text:
              print(f"ERROR: marker '{marker}' not found in {path}", file=sys.stderr)
              sys.exit(1)

          text = text.replace(marker, NEW_OPP + marker, 1)
          open(path, 'w').write(text)
          print("✅ 150MHz GPU OPP inserted")
          PYEOF

          # ── Update initial-pwrlevel: was 2 (3 levels, idx 0=high).
          #    Now we have 4 levels so index 3 = lowest = 150MHz.
          #    We keep initial-pwrlevel at 2 (= 290MHz) so the GPU
          #    doesn't boot at max — let the governor decide upward.
          #    (No change needed — level 2 is still valid index in 4-entry table)
          echo "=== GPU DTSI after patch ==="
          grep -n "opp-[0-9]" "$GPU_DTSI"

      # ── 5b. PATCH: CPU — Cap Prime Core (CPU7) to 3.0GHz ────────────
      #
      # FILE: arch/arm64/boot/dts/vendor/qcom/kona.dtsi
      #
      # The SM8250 uses cpufreq-hw-epss (hardware LUT controller).
      # There is NO OPP table for the CPU in DTS — the bootloader
      # programs the EPSS LUT at early boot.
      #
      # To limit Prime Core max frequency from 3.187GHz → 3.0GHz, we
      # use the standard Qualcomm method:
      #   → Add "qcom,cpufreq-max" property to cpufreq_hw freq-domain2
      #     (which drives CPU7, the Prime core / Kryo 585 Gold Plus).
      #
      # 3000000 kHz = 3.0GHz exactly.
      # This is written into the EPSS LUT max-frequency register via
      # the qcom,cpufreq-hw driver that reads this DT property.
      # ─────────────────────────────────────────────────────────────────
      - name: "🏎️ PATCH: CPU — Cap Prime Core to 3.0GHz"
        working-directory: kernel_src
        run: |
          CPU_DTSI="arch/arm64/boot/dts/vendor/qcom/kona.dtsi"

          echo "=== cpufreq_hw node (before patch) ==="
          grep -n -A 15 "cpufreq_hw:" "$CPU_DTSI" | head -30

          python3 - "$CPU_DTSI" << 'PYEOF'
          import sys, re

          path = sys.argv[1]
          text = open(path).read()

          if 'qcom,cpufreq-max' in text:
              print("CPU cap already present — skipping")
              sys.exit(0)

          # Locate the cpu7-notify sub-node inside cpufreq_hw and insert
          # our max-freq property directly into the cpufreq_hw node,
          # before the cpu7_notify child node.
          #
          # We target:
          #   qcom,skip-enable-check;
          #
          # and append our property right after it.
          MARKER = '\t\t\tqcom,skip-enable-check;'
          NEW_PROP = (
              '\t\t\tqcom,skip-enable-check;\n'
              '\n'
              '\t\t\t/* Extreme-PLUS Zero-Heat: Cap Prime Core to 3.0GHz */\n'
              '\t\t\t/* Domain 2 = CPU7 (Kryo 585 Gold Plus / Prime)      */\n'
              '\t\t\t/* 3000000 kHz = 3.000 GHz                           */\n'
              '\t\t\tqcom,freq-domain-max-freq = <0 0 3000000>;'
          )

          if MARKER not in text:
              # Try alternate marker
              MARKER2 = '\t\t\t#freq-domain-cells = <2>;'
              if MARKER2 in text:
                  NEW_PROP2 = (
                      '\t\t\t/* Extreme-PLUS: Cap Prime to 3.0GHz */\n'
                      '\t\t\tqcom,freq-domain-max-freq = <0 0 3000000>;\n\n'
                      '\t\t\t#freq-domain-cells = <2>;'
                  )
                  text = text.replace(MARKER2, NEW_PROP2, 1)
                  open(path, 'w').write(text)
                  print("✅ CPU Prime Core cap applied (alt marker)")
                  sys.exit(0)
              else:
                  print(f"ERROR: No suitable marker found in {path}", file=sys.stderr)
                  sys.exit(1)

          text = text.replace(MARKER, NEW_PROP, 1)
          open(path, 'w').write(text)
          print("✅ CPU Prime Core capped to 3.0GHz")
          PYEOF

          echo "=== cpufreq_hw node (after patch) ==="
          grep -n -A 20 "cpufreq_hw:" "$CPU_DTSI" | head -35

      # ── 5c. PATCH: Copy any extra .patch files from this repo ─────────
      - name: "📋 Apply extra patch files (if any)"
        working-directory: kernel_src
        run: |
          PATCH_DIR="${{ github.workspace }}/build-repo/patches"
          if [ -d "$PATCH_DIR" ] && ls "$PATCH_DIR"/*.patch 1>/dev/null 2>&1; then
            for p in "$PATCH_DIR"/*.patch; do
              echo "Applying: $p"
              git apply --ignore-whitespace "$p" || echo "⚠️ Patch $p failed — continuing"
            done
          else
            echo "No extra .patch files found — skipping"
          fi

      # ── 6. Create out directory ───────────────────────────────────────
      - name: "📁 Create build output directory"
        run: mkdir -p "${{ env.KERNEL_OUT }}"

      # ── 7. Generate .config from defconfig ───────────────────────────
      - name: "⚙️ Generate .config"
        working-directory: kernel_src
        run: |
          make \
            O="${{ env.KERNEL_OUT }}" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${{ env.CROSS_COMPILE }}" \
            CROSS_COMPILE_COMPAT="${{ env.CROSS_COMPILE_COMPAT }}" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            "${{ env.DEFCONFIG }}"
          echo "✅ defconfig applied"

      # ── 8. Build the kernel ───────────────────────────────────────────
      - name: "🔨 Compile kernel (Image + DTBS)"
        working-directory: kernel_src
        run: |
          set -euo pipefail
          NPROC=$(nproc --all)
          echo "Building with ${NPROC} threads..."

          make \
            -j"${NPROC}" \
            O="${{ env.KERNEL_OUT }}" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${{ env.CROSS_COMPILE }}" \
            CROSS_COMPILE_COMPAT="${{ env.CROSS_COMPILE_COMPAT }}" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz dtbs dtbo.img modules 2>&1 | tee /tmp/build.log

          echo "=== Build artifacts ==="
          ls -lh "${{ env.KERNEL_OUT }}/arch/arm64/boot/"
          echo "✅ Kernel compiled successfully"

      # ── 9. Clone & configure AnyKernel3 ──────────────────────────────
      - name: "📦 Setup AnyKernel3"
        run: |
          git clone --depth=1 --branch "${{ env.AK3_BRANCH }}" \
            "${{ env.AK3_REPO }}" "${{ env.AK3_DIR }}"

          # Write device-specific anykernel.sh
          cat > "${{ env.AK3_DIR }}/anykernel.sh" << 'AK3EOF'
          # AnyKernel3 properties — Extreme-PLUS Kernel (munch / POCO F4)
          properties() { '
          kernel.string=Extreme-PLUS Zero-Heat Kernel by PandeyJI-9
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=munch
          device.name2=POCO F4
          device.name3=22021211RG
          device.name4=23013PC75G
          supported.versions=12-15
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          . tools/busybox/update.sh;

          ## AnyKernel methods (see https://github.com/osm0sis/AnyKernel3)
          set_perm_recursive 0 0 755 644 $TMPDIR/dtbo;

          # Install kernel + dtbo
          flash_generic_dtb;
          write_boot;
          AK3EOF

          echo "✅ AnyKernel3 configured"

      # ── 10. Package into flashable ZIP ───────────────────────────────
      - name: "🗜️ Package flashable ZIP"
        run: |
          set -euo pipefail
          mkdir -p "${{ env.ZIP_OUT }}"

          # Copy Image.gz
          cp "${{ env.KERNEL_OUT }}/arch/arm64/boot/Image.gz" \
             "${{ env.AK3_DIR }}/Image.gz"

          # Copy compiled DTBOs (munch-specific)
          DTBO_SRC="${{ env.KERNEL_OUT }}/arch/arm64/boot/dts/vendor/xiaomi"
          if [ -f "$DTBO_SRC/munch-sm8250-overlay.dtbo" ]; then
            cp "$DTBO_SRC/munch-sm8250-overlay.dtbo" "${{ env.AK3_DIR }}/dtbo.img"
          elif [ -f "${{ env.KERNEL_OUT }}/dtbo.img" ]; then
            cp "${{ env.KERNEL_OUT }}/dtbo.img" "${{ env.AK3_DIR }}/dtbo.img"
          fi

          # Build timestamp
          BUILD_DATE=$(date -u +"%Y%m%d-%H%M")
          KSU_SUFFIX=""
          if [ "${{ github.event.inputs.enable_ksu }}" = "true" ]; then
            KSU_SUFFIX="-KSU"
          fi
          ZIP_NAME="Extreme-PLUS-ZeroHeat-munch-${BUILD_DATE}${KSU_SUFFIX}.zip"

          # Create zip
          cd "${{ env.AK3_DIR }}"
          zip -r9 "${{ env.ZIP_OUT }}/${ZIP_NAME}" . \
            -x "*.git*" "*.github*" "*.DS_Store"

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "ZIP_PATH=${{ env.ZIP_OUT }}/${ZIP_NAME}" >> $GITHUB_ENV
          ls -lh "${{ env.ZIP_OUT }}/${ZIP_NAME}"
          echo "✅ Flashable ZIP ready: ${ZIP_NAME}"

      # ── 11. Upload ZIP as artifact ────────────────────────────────────
      - name: "⬆️ Upload ZIP artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ZIP_NAME }}"
          path: "${{ env.ZIP_PATH }}"
          retention-days: 14

      # ── 12. Upload build log on failure ──────────────────────────────
      - name: "📋 Upload build log (on failure)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "build-failure-log"
          path: /tmp/build.log
          retention-days: 7

      # ── 13. Optional: Create GitHub Release ──────────────────────────
      - name: "🚀 Create GitHub Release"
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          gh release create "$TAG" \
            "${{ env.ZIP_PATH }}" \
            --repo "${{ github.repository }}" \
            --title "Extreme-PLUS Zero-Heat ${TAG} (munch/POCO F4)" \
            --notes "$(cat << 'NOTES'
          ## 🌡️ Extreme-PLUS Zero-Heat Kernel — ${TAG}

          **Device:** POCO F4 (munch) | SM8250 | Adreno 650

          ### Tuning Applied
          | Component | Change | Effect |
          |-----------|--------|--------|
          | GPU (Adreno 650) | +150MHz idle OPP @ MIN_SVS voltage | -30% GPU idle power |
          | CPU7 (Prime / Kryo 585) | Max capped 3.187→3.0GHz | -10% peak heat |
          | All other cores | Stock frequencies | No regression |
          | Display / Haptics / Sensors | Untouched | HyperOS 3 compatible |

          ### Flash Instructions
          1. Boot into TWRP/OrangeFox recovery
          2. Flash this ZIP
          3. Wipe Dalvik / ART cache
          4. Reboot

          > Built with Proton Clang from AstideLabs kernel (branch: android17-aptusitu)
          NOTES
          )"
          echo "✅ GitHub Release created: ${TAG}"
