# ════════════════════════════════════════════════════════════
#  EXTREME++GAMING — Fast CI Test (defconfig + DTB only)
#  MANUAL DISPATCH ONLY
# ════════════════════════════════════════════════════════════
name: "🧪 Fast CI Test (defconfig + DTB)"

on:
  workflow_dispatch:

env:
  KERNEL_REPO:   "https://github.com/AstideLabs/android_kernel_xiaomi_sm8250"
  KERNEL_BRANCH: "android17-aptusitu"
  DEFCONFIG:     "munch_defconfig"
  CLANG_DIR:     "${{ github.workspace }}/proton-clang"

jobs:
  test:
    name: "defconfig + DTB sanity check"
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: "📦 Checkout build repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex git libelf-dev libssl-dev \
            lld llvm python3 wget gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu device-tree-compiler

      - name: "⚡ Restore Clang cache"
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: proton-clang-v2

      - name: "⚡ Download Clang"
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.CLANG_DIR }}"
          wget -qO /tmp/clang.tar.gz \
            "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz"
          tar -xzf /tmp/clang.tar.gz --strip-components=1 -C "${{ env.CLANG_DIR }}"

      - name: "🌐 Fetch kernel source"
        run: |
          git clone --depth=1 --branch "${{ env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" kernel_src

      - name: "🩹 Apply patches"
        run: |
          chmod +x patches/apply-all.sh
          bash patches/apply-all.sh kernel_src

      - name: "⚙️ Test: make defconfig"
        working-directory: kernel_src
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          mkdir -p out_test
          make O=out_test ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld "${{ env.DEFCONFIG }}"
          echo "✅ defconfig passed"

      - name: "🌲 Test: Compile DTBs only"
        working-directory: kernel_src
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          make -j$(nproc) O=out_test ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld dtbs 2>&1 | tail -30
          echo "✅ DTB compilation passed"

      - name: "✅ Result"
        run: echo "All checks passed — GPU/CPU patches compile cleanly."
