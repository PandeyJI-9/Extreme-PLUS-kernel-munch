# ╔══════════════════════════════════════════════════════════════╗
# ║  EXTREME++HyperOS — GOD-MODE BUILD PIPELINE                  ║
# ║  POCO F4 (munch) | SM8250-AC | Snapdragon 870               ║
# ║  Maintainer: PandeyJI-9                                     ║
# ╚══════════════════════════════════════════════════════════════╝
name: "🔥 EXTREME++ Build & Release"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v4.0-extreme)"
        required: true
        default: "Beta-1.0"
      inject_sukisu:
        description: "Inject SukiSU Ultra (root)?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  KERNEL_REPO: "https://github.com/AstideLabs/android_kernel_xiaomi_sm8250"
  KERNEL_BRANCH: "android17-aptusitu"
  CLANG_URL: "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Patch → Compile → Release"
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: "📢 Telegram: Build Started"
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ] && exit 0
          TEXT=$(cat << 'MSGEOF'
          🚧 <b>EXTREME++HyperOS Build Started!</b> 🚧
          📱 Device: POCO F4 (munch)
          🏷 Tag: <code>${{ inputs.release_tag }}</code>
          MSGEOF
          )
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" -d text="${TEXT}"

      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk git gnupg gperf imagemagick libncurses-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 mkbootimg

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          wget -qO /tmp/clang.tar.gz "$CLANG_URL"
          tar -zxvf /tmp/clang.tar.gz
          echo "$HOME/zyc-clang/bin" >> $GITHUB_PATH

      - name: "🌐 Clone kernel source"
        run: |
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: "🩹 Apply EXTREME++ patches (CPU/GPU/Names)"
        run: |
          chmod +x config-repo/patches/apply-all.sh
          bash config-repo/patches/apply-all.sh kernel

      - name: "⚙️ Replace Dev Script with OUR Script"
        run: |
          # YAHAN FIX KIYA HAI! Tere patches folder se utha raha hai
          echo "Copying custom build_kernel.sh from patches folder..."
          cp config-repo/patches/build_kernel.sh kernel/build_kernel.sh
          chmod +x kernel/build_kernel.sh
          echo "✅ Custom script successfully injected!"

      - name: "🔨 Compile Kernel (The EXTREME Engine)"
        working-directory: kernel
        run: |
          if [ "${{ inputs.inject_sukisu }}" == "true" ]; then
            echo "Running custom build script WITH Root..."
            ./build_kernel.sh munch ksu miui
          else
            echo "Running custom build script WITHOUT Root..."
            ./build_kernel.sh munch miui
          fi

      - name: "🚀 Create GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" "$ZIP_PATH" \
            --repo "${{ github.repository }}" \
            --title "EXTREME++HyperOS ${{ inputs.release_tag }} | POCO F4 (munch)" \
            --notes "God-Mode Build. SukiSU Ultra Root, CPU 2.8GHz, & GPU 150MHz UV Guaranteed."

      - name: "📢 Telegram: Build Success"
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ] && exit 0
          DL="https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}"
          TEXT=$(cat << EOF
          ⚡ <b>EXTREME++HyperOS Kernel</b> — <code>${{ inputs.release_tag }}</code>

          📱 Device: POCO F4 (munch)
          🎮 GPU: 150MHz Extreme UV
          🏎 CPU: 2.8GHz Capped
          🔑 Root: SukiSU Ultra ✅

          📥 <a href="${DL}">Download ZIP</a>
          EOF
          )
          MSG_RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
            -d text="${TEXT}")
            
          MSG_ID=$(echo "$MSG_RESPONSE" | grep -o '"message_id":[0-9]*' | cut -d: -f2)
          
          if [ -f "$ZIP_PATH" ] && [ -n "$MSG_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"$ZIP_PATH" \
              -F reply_to_message_id="$MSG_ID" \
              -F caption="📦 Flashable ZIP: ${ZIP_NAME}"
          elif [ -f "$ZIP_PATH" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"$ZIP_PATH" \
              -F caption="📦 Flashable ZIP: ${ZIP_NAME}"
          fi
