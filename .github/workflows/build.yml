name: "🚀 Build EXTREME++ Kernel (Dual Variant: 3.2GHz & 2.8GHz)"

on:
  workflow_dispatch:
    inputs:
      build_ksu:
        description: 'Build with Root (RKSU)?'
        required: true
        type: boolean
        default: true
      variant:
        description: 'Target Prime Frequency Variant'
        required: true
        type: choice
        options:
          - both
          - 3.2GHz
          - 2.8GHz
        default: both

jobs:
  build:
    name: "Compile → Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 180 

    steps:
      - name: "📢 Telegram: Build Started"
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚀 <b>EXTREME++ Build Started!</b>%0A📱 Device: POCO F4 (munch)%0A⚙️ Root (RKSU): ${{ inputs.build_ksu }}%0A⚡ Variant: ${{ inputs.variant }}" -d parse_mode="HTML" || true

      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone kernel source"
        run: |
          git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel

      - name: "⚙️ Inject PandeyJI Custom Build Script"
        run: |
          cp patches/* kernel/
          chmod +x kernel/build_kernel.sh

      # 🔥 FIX 2: THE MASTER ZRAM/SWAP HACK (Fixed for GitHub OverlayFS)
      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Checking current RAM..."
          free -h
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "[*] New RAM Capacity:"
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        run: |
          cd kernel
          TARGET_VAR="${{ inputs.variant }}"
          [ -z "$TARGET_VAR" ] && TARGET_VAR="both"
          if [ "${{ inputs.build_ksu }}" == "false" ]; then
            ./build_kernel.sh munch noroot "$TARGET_VAR"
          else
            ./build_kernel.sh munch ksu "$TARGET_VAR"
          fi
          
          echo "✅ Built ZIP files:"
          ls -lh *munch*.zip

      - name: "🚀 Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kernel/*munch*.zip
          tag_name: "Stable-testing-v1.1.2.${{ github.run_number }}"
          name: "EXTREME++ Build #${{ github.run_number }} (Dual Variant: 3.2GHz & 2.8GHz)"
          body: |
            ## 🚀 EXTREME++ GAMING HyperOS Kernel (Dual Variant)

            ### 📱 Device & Build Information
            - **Device:** POCO F4 (munch / munch-in)
            - **SoC:** Qualcomm Snapdragon 870 5G (SM8250-AC / Kona v2.1)
            - **Target OS:** HyperOS / MIUI Android 13–17
            - **Build Number:** #${{ github.run_number }}
            - **Toolchain:** ZyC-Clang 16.0.6 + LLD + ccache
            - **Root & Hooks:** ReSukiSU Non-GKI 4.19 Legacy with SuSFS v1.5.5

            ---

            ### 🔥 Dual Variants Available in this Release
            - 🚀 **`EXTREME++_HyperOS_munch_3.2GHz_*.zip`**: Stock uncapped 3.2 GHz Prime peak for maximum raw benchmark performance.
            - ❄️ **`EXTREME++_HyperOS_munch_2.8GHz_*.zip`**: Prime core capped at 2.84 GHz via safe post-boot service (`policy7/scaling_max_freq = 2841600`) for zero thermal throttling and sustained cool gaming.

            ---

            ### ⚡ Real Kernel-Level Optimizations
            - 🌐 **TCP BBR Congestion Control:** Native `CONFIG_TCP_CONG_BBR=y`, `CONFIG_DEFAULT_BBR=y`, and `CONFIG_NET_SCH_FQ=y` for ultra-low ping, zero bufferbloat, and instant bullet registration in BGMI/COD.
            - ⚡ **Zero-Overhead Storage:** I/O stats accounting disabled on all block queues (`/sys/block/*/queue/iostats = 0`) to eliminate storage overhead and speed up game loading.
            - 🛡️ **Debloated Kernel Logging:** Heavy debug options (`SCHEDSTATS`, `LOCKDEP`, `PROVE_LOCKING`, `DEBUG_KMEMLEAK`, `DEBUG_PREEMPT`) purged for lean, high-throughput context switching.
            - ⚡ **Governor Boot Safety & EXTREME+:** Safe stock Qualcomm `schedutil` boot governor with `EXTREME+` custom governor compiled as native selectable module.
            - 🎮 **GPU Undervolt (FakeDreamer 150MHz - 670MHz):** 100% verified working FakeDreamer table across all speed bins with native `msm-adreno-tz` TrustZone governor.
            - 🎯 **Smart LMK "Sniper Method":** ZRAM ZSTD with whitelisted games/messaging/audio apps (`oom_score_adj = -900`) and surgical bloatware snipe on high memory pressure.

            ---

            ### 📦 Flashing Instructions
            1. Boot into custom recovery (TWRP / OrangeFox).
            2. Flash your chosen kernel ZIP variant (3.2GHz for max speed, 2.8GHz for cool gaming).
            3. Reboot system and install **ReSukiSU / KernelSU Manager**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "🧹 Clean Old GitHub Releases (Keep Latest Only)"
        if: success()
        run: |
          python3 -c "
          import urllib.request, json, os, ssl
          ctx = ssl._create_unverified_context()
          token = os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          current_tag = 'Stable-testing-v1.1.2.${{ github.run_number }}'

          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases', headers={
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'Release-Cleaner'
          })
          try:
              with urllib.request.urlopen(req, context=ctx) as resp:
                  releases = json.loads(resp.read().decode())
              for r in releases:
                  if r.get('tag_name') != current_tag:
                      print(f'Deleting old release {r.get(\"tag_name\")} (ID: {r.get(\"id\")})...')
                      del_req = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/{r[\"id\"]}', headers={
                          'Authorization': f'token {token}',
                          'Accept': 'application/vnd.github.v3+json',
                          'User-Agent': 'Release-Cleaner'
                      }, method='DELETE')
                      urllib.request.urlopen(del_req, context=ctx)
                      print(f'Successfully deleted release {r.get(\"id\")}')
          except Exception as e:
              print(f'Note on release cleanup: {e}')
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "📢 Telegram: Build Success"
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ <b>EXTREME++ Build #${{ github.run_number }} Completed!</b>%0A🔥 Dual Variants (3.2GHz & 2.8GHz) ready for testing." -d parse_mode="HTML" || true
          for z in $(find "$GITHUB_WORKSPACE/kernel" -maxdepth 1 -name "*munch*.zip"); do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F document=@"$z" \
              -F caption="📦 $(basename "$z")" || true
          done
