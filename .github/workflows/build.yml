name: 🔥 EXTREME++ Build & Release

on:
  workflow_dispatch:
    inputs:
      build_ksu:
        description: 'Build with Root (RKSU)?'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: "Compile → Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # 🔥 FIX 1: Increased timeout so GitHub doesn't silently cancel the workflow
    timeout-minutes: 180 

    steps:
      - name: "📢 Telegram: Build Started"
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚀 <b>EXTREME++ Build Started!</b>%0A📱 Device: POCO F4 (munch)%0A⚙️ Root (RKSU): ${{ inputs.build_ksu }}" -d parse_mode="HTML" || true

      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone kernel source"
        run: |
          git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel

      - name: "⚙️ Inject PandeyJI Custom Build Script"
        run: |
          cp patches/build_kernel.sh kernel/
          chmod +x kernel/build_kernel.sh

      # 🔥 FIX 2: THE MASTER ZRAM/SWAP HACK (Fixed for GitHub OverlayFS)
      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Checking current RAM..."
          free -h
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "[*] New RAM Capacity:"
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        run: |
          cd kernel
          if [ "${{ inputs.build_ksu }}" == "true" ]; then
            ./build_kernel.sh munch ksu
          else
            ./build_kernel.sh munch
          fi
          
          # Fix path export for release
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*munch_*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "ZIP_PATH=${ZIP_FILE}" >> $GITHUB_ENV
            echo "✅ ZIP located: $ZIP_FILE"
          else
            echo "❌ ZIP NOT FOUND!"
            exit 1
          fi

      - name: "🚀 Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          tag_name: "Beta-testing-v1.1.2.${{ github.run_number }}"
          name: "EXTREME++ Build #${{ github.run_number }}"
          body: |
            ## 🚀 EXTREME++ GAMING HyperOS Kernel

            ### 📱 Device & Build Information
            - **Device:** POCO F4 (munch / munch-in)
            - **SoC:** Qualcomm Snapdragon 870 5G (SM8250-AC / Kona v2.1)
            - **Target OS:** HyperOS / MIUI Android 13–17
            - **Build Number:** #${{ github.run_number }}
            - **Toolchain:** ZyC-Clang 16.0.6 + LLD + ccache
            - **Root & Hooks:** ReSukiSU Non-GKI 4.19 Legacy with SuSFS v1.5.5

            ---

            ### ⚡ Performance & Thermal Optimizations
            - 🏎 **CPU Frequency Cap:** Prime Core hard-capped at **2.84 GHz** (`2841600`) via `qcom-cpufreq-hw` driver & `kona.dtsi` to eliminate 3.2 GHz thermal throttle spikes.
            - 🎮 **GPU Undervolt (UV) & OS-Independent Lock:** FakeDreamer **10-Step OPP Table (150 MHz – 670 MHz)** applied with RPMh safe voltage mapping:
              - **C-Level Kernel Driver Enforcement:** `drivers/gpu/msm/adreno.c` hardcodes all 10 power levels natively to bypass HyperOS 3/4 DTBO overlays and vendor partitions.
              - **Joyose & User-Space Blocker:** `/sys/class/kgsl/kgsl-3d0/max_pwrlevel`, `min_pwrlevel`, and Xiaomi `/sys/kernel/gpu/gpu_min_clock`/`max_clock` interceptors drop artificial user-space throttling.
              - **Ultra-Low Idle States:** `250 MHz`, `200 MHz`, `150 MHz` for maximum battery efficiency.
              - `KGSL_MAX_PWRLEVELS` expanded to 16 for full 10-step frequency scaling.
            - 🚀 **Zero Heat Policy:** 100% untouched stock thermal-engine, trip points, and TSENS. Hardware-safe sustained gaming.
            - 🧠 **Memory & Responsiveness:**
              - ZRAM compressed with **ZSTD** algorithm (`CONFIG_ZRAM_DEF_COMP_ZSTD=y`).
              - Instant touch response: Schedutil `up_rate_limit_us` tuned to 0 for instant ramp-up.
              - Optimized `vm.swappiness = 100` & `vfs_cache_pressure = 100` for lag-free multitasking on 6GB/8GB RAM models.

            ---

            ### 📦 Flashing Instructions
            1. Boot into custom recovery (TWRP / OrangeFox).
            2. Flash the kernel ZIP (`split_boot` method preserves stock HyperOS ramdisk).
            3. Reboot system and install **ReSukiSU / KernelSU Manager**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "🧹 Clean Old GitHub Releases (Keep Latest Only)"
        if: success()
        run: |
          python3 -c "
          import urllib.request, json, os, ssl
          ctx = ssl._create_unverified_context()
          token = os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          current_tag = 'Beta-testing-v1.1.2.${{ github.run_number }}'

          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases', headers={
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'Release-Cleaner'
          })
          try:
              with urllib.request.urlopen(req, context=ctx) as resp:
                  releases = json.loads(resp.read().decode())
              for r in releases:
                  if r.get('tag_name') != current_tag:
                      print(f'Deleting old release {r.get(\"tag_name\")} (ID: {r.get(\"id\")})...')
                      del_req = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/{r[\"id\"]}', headers={
                          'Authorization': f'token {token}',
                          'Accept': 'application/vnd.github.v3+json',
                          'User-Agent': 'Release-Cleaner'
                      }, method='DELETE')
                      urllib.request.urlopen(del_req, context=ctx)
                      print(f'Successfully deleted release {r.get(\"id\")}')
          except Exception as e:
              print(f'Note on release cleanup: {e}')
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "📢 Telegram: Build Success"
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ <b>EXTREME++ Build #${{ github.run_number }} Completed!</b>%0A📥 Kernel is ready for testing." -d parse_mode="HTML" || true
          if [ -n "${{ env.ZIP_PATH }}" ] && [ -f "${{ env.ZIP_PATH }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F document=@"${{ env.ZIP_PATH }}" \
              -F caption="📦 EXTREME++ Build #${{ github.run_number }} Flashable ZIP" || true
          fi
