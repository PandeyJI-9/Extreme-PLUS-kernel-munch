name: 🔥 EXTREME++ Build & Release

on:
  workflow_dispatch:
    inputs:
      build_ksu:
        description: 'Build with Root (RKSU)?'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: "Compile → Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # 🔥 FIX 1: Increased timeout so GitHub doesn't silently cancel the workflow
    timeout-minutes: 180 

    steps:
      - name: "📢 Telegram: Build Started"
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚀 <b>EXTREME++ Build Started!</b>%0A📱 Device: POCO F4 (munch)%0A⚙️ Root (RKSU): ${{ inputs.build_ksu }}" -d parse_mode="HTML" || true

      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone kernel source"
        run: |
          git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel

      - name: "🩹 Apply EXTREME++ CPU/GPU Patches"
        run: |
          cp patches/apply-cpu-cap.py kernel/
          cp patches/apply-gpu-opp.py kernel/
          cd kernel
          python3 apply-cpu-cap.py || true
          python3 apply-gpu-opp.py || true

      - name: "⚙️ Inject PandeyJI Custom Build Script"
        run: |
          cp patches/build_kernel.sh kernel/
          chmod +x kernel/build_kernel.sh

      # 🔥 FIX 2: THE MASTER ZRAM/SWAP HACK (Fixed for GitHub OverlayFS)
      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Checking current RAM..."
          free -h
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "[*] New RAM Capacity:"
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        run: |
          cd kernel
          if [ "${{ inputs.build_ksu }}" == "true" ]; then
            ./build_kernel.sh munch ksu
          else
            ./build_kernel.sh munch
          fi
          
          # Fix path export for release
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "EXTREME_HyperOS_munch_*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "ZIP_PATH=${ZIP_FILE}" >> $GITHUB_ENV
            echo "✅ ZIP located: $ZIP_FILE"
          else
            echo "❌ ZIP NOT FOUND!"
            exit 1
          fi

      - name: "🚀 Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          tag_name: "Beta-testing-v1.1.2.${{ github.run_number }}"
          name: "EXTREME++ Build #${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "📢 Telegram: Build Success"
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ <b>EXTREME++ Build #${{ github.run_number }} Completed!</b>%0A📥 Kernel is ready for testing." -d parse_mode="HTML" || true
          if [ -n "${{ env.ZIP_PATH }}" ] && [ -f "${{ env.ZIP_PATH }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F document=@"${{ env.ZIP_PATH }}" \
              -F caption="📦 EXTREME++ Build #${{ github.run_number }} Flashable ZIP" || true
          fi
