name: "🚀 Build EXTREME++ Kernel (BMW Edition - Dynamic Profiles)"

on:
  workflow_dispatch:
    inputs:
      root_mode:
        description: 'Root Variant: ksu_susfs (SuSFS v2.3.0) | ksu_no_susfs (Standard KSU) | noroot (Pure Clean) | all'
        required: true
        type: choice
        default: 'ksu_susfs'
        options:
          - 'ksu_susfs'
          - 'ksu_no_susfs'
          - 'noroot'
          - 'all'
          - 'both'
      target_os:
        description: 'Target OS: both | hyperos | aosp'
        required: true
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'hyperos'
          - 'aosp'
jobs:
  build:
    name: "Compile → Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 180 

    steps:
      - name: "📢 Telegram: Build Started"
        continue-on-error: true
        run: |
          TARGETS=()
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_CHAT_ID }}")
          [ -n "${{ secrets.TELEGRAM_DM_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_DM_ID }}")

          ROOT_LABEL="⚡ Root: KowSU Multi-Manager Root (SuSFS v2.3.0)"
          if [ "${{ inputs.root_mode }}" = "noroot" ]; then
            ROOT_LABEL="🛡️ Architecture: Pure Clean Base (No Root)"
          elif [ "${{ inputs.root_mode }}" = "ksu_no_susfs" ]; then
            ROOT_LABEL="⚡ Root: KowSU Multi-Manager (Standard Clean KSU / No SuSFS)"
          elif [ "${{ inputs.root_mode }}" = "both" ]; then
            ROOT_LABEL="⚡ Dual Release: KowSU + SuSFS v2.3.0 & Pure Clean Base (No Root)"
          elif [ "${{ inputs.root_mode }}" = "all" ]; then
            ROOT_LABEL="🚀 Complete Suite: KowSU + SuSFS, KowSU Standard KSU, and Pure Clean Base"
          fi

          TARGET_LABEL="Dual Target: HyperOS 4 + AOSP (A16 & A17)"
          if [ "${{ inputs.target_os }}" = "hyperos" ]; then
            TARGET_LABEL="Xiaomi HyperOS / HyperOS 4 ONLY"
          elif [ "${{ inputs.target_os }}" = "aosp" ]; then
            TARGET_LABEL="AOSP ONLY (Android 13–17 / A16 & A17 Tested)"
          fi

          START_MSG=$(printf '🚀 <b>EXTREME++ Build Started!</b>\n📱 <b>Device:</b> POCO F4 (munch)\n🏎️ <b>Edition:</b> EXTREME++ Gaming (BMW Edition)\n🎯 <b>Target:</b> %s\n%s\n⚡ <b>Default Clock:</b> 3.19 GHz Unlocked Peak (Dynamic Profiles)\n👑 <b>Author:</b> Extreme++ by @pandey_ji_8' "${TARGET_LABEL}" "${ROOT_LABEL}")

          for chat in "${TARGETS[@]}"; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              --data-urlencode "chat_id=$chat" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=$START_MSG" || true
          done

      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip unzip zlib1g-dev python3 python3-pip

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone kernel source (Build #125 pinned base)"
        run: |
          mkdir kernel && cd kernel
          git init
          git remote add origin https://github.com/AstideLabs/android_kernel_xiaomi_sm8250
          git fetch --depth=1 origin refs/pull/74/merge
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "fcf366797808bcc938a7248cded079cf6ea2e26d"
          cd ..

      - name: "⚙️ Inject PandeyJI Custom Build Script"
        run: |
          cp patches/* kernel/
          chmod +x kernel/build_kernel.sh

      # 🔥 FIX 2: THE MASTER ZRAM/SWAP HACK (Fixed for GitHub OverlayFS)
      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Checking current RAM..."
          free -h
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "[*] New RAM Capacity:"
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        run: |
          cd kernel
          ./build_kernel.sh munch "${{ inputs.root_mode }}" "${{ inputs.target_os }}"
          
          echo "✅ Built ZIP files:"
          ls -lh EXTREME++*.zip

      - name: "📦 Package Raw Kernel Images for HyperOS 4 (.img / dtb)"
        if: success()
        run: |
          echo "[*] Checking for HyperOS raw images (.img / dtb) for HyperOS 4 developer testing..."
          IMG_DIR="$GITHUB_WORKSPACE/raw_kernel_images_staging"
          OUT_ZIP_DIR="$GITHUB_WORKSPACE/raw_images"
          mkdir -p "$IMG_DIR" "$OUT_ZIP_DIR"

          # HyperOS output directory only. Never fall back to AOSP output.
          HYPEROS_BOOT="$GITHUB_WORKSPACE/kernel/out_hyperos/arch/arm64/boot"

          if [ -d "$HYPEROS_BOOT" ] && [ -f "$HYPEROS_BOOT/Image" ]; then
            # 1. Main Kernel Binary (do not call this boot.img)
            cp -f "$HYPEROS_BOOT/Image" "$IMG_DIR/Image"
            echo "  [+] Included Image from $HYPEROS_BOOT/Image ($(du -h "$IMG_DIR/Image" | cut -f1))"

            # 2. DTBO Image
            if [ -f "$HYPEROS_BOOT/dtbo.img" ]; then
              cp -f "$HYPEROS_BOOT/dtbo.img" "$IMG_DIR/dtbo.img"
              echo "  [+] Included dtbo.img from $HYPEROS_BOOT/dtbo.img"
            fi

            # 3. DTB Blob / Table
            if [ -f "$HYPEROS_BOOT/dtb" ]; then
              cp -f "$HYPEROS_BOOT/dtb" "$IMG_DIR/dtb"
              cp -f "$HYPEROS_BOOT/dtb" "$IMG_DIR/dtb.img"
              echo "  [+] Included dtb & dtb.img from $HYPEROS_BOOT/dtb"
            elif [ -f "$HYPEROS_BOOT/dtb.img" ]; then
              cp -f "$HYPEROS_BOOT/dtb.img" "$IMG_DIR/dtb.img"
              cp -f "$HYPEROS_BOOT/dtb.img" "$IMG_DIR/dtb"
              echo "  [+] Included dtb.img from $HYPEROS_BOOT/dtb.img"
            fi

            # 4. Any other *.img files
            find "$HYPEROS_BOOT" -maxdepth 1 -name "*.img" -exec cp -f {} "$IMG_DIR/" \; 2>/dev/null || true

            # 5. Compress into a clean, lossless ZIP package
            RAW_ZIP_NAME="EXTREME++_HyperOS4_Raw_Images_Build_${{ github.run_number }}.zip"
            (
              cd "$IMG_DIR"
              zip -9 -r "$OUT_ZIP_DIR/$RAW_ZIP_NAME" ./*
            )
            rm -rf "$IMG_DIR"

            echo "✅ Created HyperOS 4 Raw Images ZIP: $OUT_ZIP_DIR/$RAW_ZIP_NAME ($(du -h "$OUT_ZIP_DIR/$RAW_ZIP_NAME" | cut -f1))"
            echo "RAW_IMAGES_ZIP_PATH=$OUT_ZIP_DIR/$RAW_ZIP_NAME" >> $GITHUB_ENV
            echo "RAW_IMAGES_ZIP_NAME=$RAW_ZIP_NAME" >> $GITHUB_ENV
          else
            echo "ℹ️ HyperOS output not found (e.g. only AOSP was requested). Skipping HyperOS raw images zip."
          fi

      - name: "🔐 Repack HyperOS images from Google Drive"
        id: repack
        if: success() && (inputs.target_os == 'hyperos' || inputs.target_os == 'both')
        env:
          # Any of these works. A repo *variable* is enough (no secret needed):
          # Settings → Variables → HYPEROS_STOCK_URL, or Secrets → hyperosimgs.
          HYPEROSIMGS_URL: ${{ secrets.hyperosimgs || secrets.HYPEROSIMGS || secrets.HYPEROS_IMGS || secrets.HYPEROS_IMAGES || vars.HYPEROS_STOCK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${HYPEROSIMGS_URL:-}" ]; then
            echo "::warning::Stock HyperOS images are not configured (secret 'hyperosimgs' / variable 'HYPEROS_STOCK_URL' unset)."
            echo "::warning::Skipping the flashable repack; the kernel ZIPs are still built and released."
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BOOT_DIR="$GITHUB_WORKSPACE/kernel/out_hyperos/arch/arm64/boot"

          if [ ! -f "$BOOT_DIR/Image" ]; then
            echo "::error::HyperOS Image not found in $BOOT_DIR! Kernel compilation did not produce an Image."
            exit 1
          fi

          if [ ! -f "$BOOT_DIR/dtb" ]; then
            echo "::error::HyperOS dtb not found in $BOOT_DIR! The build must produce arch/arm64/boot/dtb."
            exit 1
          fi

          STOCK_DIR="$GITHUB_WORKSPACE/hyperos4_stock"
          OUT_DIR="$GITHUB_WORKSPACE/hyperos4_images"
          rm -rf "$STOCK_DIR" "$OUT_DIR"
          mkdir -p "$STOCK_DIR" "$OUT_DIR"

          python3 -m pip install --user --upgrade gdown cryptography
          export STOCK_DIR
          python3 - <<'PY'
          import os
          import re
          import sys
          import gdown

          raw = os.environ.get("HYPEROSIMGS_URL", "").strip().strip('"').strip("'")
          stock_dir = os.environ["STOCK_DIR"]
          if not raw:
              print("::error::HYPEROSIMGS_URL is empty!", file=sys.stderr)
              sys.exit(1)

          # Extract folder ID if present
          folder_id = None
          m = re.search(r'/folders/([a-zA-Z0-9_-]+)', raw)
          if m:
              folder_id = m.group(1)
          elif re.search(r'[?&]id=([a-zA-Z0-9_-]+)', raw):
              folder_id = re.search(r'[?&]id=([a-zA-Z0-9_-]+)', raw).group(1)
          elif re.search(r'/d/([a-zA-Z0-9_-]+)', raw):
              folder_id = re.search(r'/d/([a-zA-Z0-9_-]+)', raw).group(1)
          elif re.fullmatch(r'[a-zA-Z0-9_-]+', raw):
              folder_id = raw

          print(f"[*] Downloading stock HyperOS 4 images from Google Drive: {raw}")

          success = False
          if folder_id:
              try:
                  print(f"[*] Attempting folder download by ID: {folder_id}")
                  res = gdown.download_folder(id=folder_id, output=stock_dir, quiet=False, use_cookies=False)
                  if res:
                      success = True
                  else:
                      print("[*] gdown folder download by ID returned no files", file=sys.stderr)
              except Exception as exc:
                  print(f"[*] gdown folder download by ID failed: {exc}", file=sys.stderr)

          if not success:
              url = raw if raw.startswith(("http://", "https://")) else f"https://drive.google.com/drive/folders/{raw}"
              try:
                  print(f"[*] Attempting folder download by URL: {url}")
                  res = gdown.download_folder(url=url, output=stock_dir, quiet=False, use_cookies=False)
                  if res:
                      success = True
                  else:
                      print("[*] gdown folder download by URL returned no files", file=sys.stderr)
              except Exception as exc:
                  print(f"[*] gdown folder download by URL failed: {exc}", file=sys.stderr)

          if not success and folder_id:
              try:
                  print("[*] Attempting file download in case URL is a single archive...")
                  res = gdown.download(id=folder_id, output=os.path.join(stock_dir, "stock_images.zip"), quiet=False)
                  if res:
                      success = True
              except Exception as exc:
                  print(f"[*] gdown file download failed: {exc}", file=sys.stderr)

          if not success:
              print(
                  "::error::Unable to download the Google Drive stock images. "
                  "Check that the 'hyperosimgs' secret contains the folder link and the folder is shared as "
                  "'Anyone with the link - Viewer'.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

          # Extract any downloaded zip archives if present
          while IFS= read -r -d '' z; do
            echo "[*] Extracting downloaded archive: $z"
            if ! unzip -q -o "$z" -d "$STOCK_DIR"; then
              echo "::error::Failed to extract downloaded archive: $z"
              exit 1
            fi
          done < <(find "$STOCK_DIR" -type f -name "*.zip" -print0 2>/dev/null)

          # Locate and flatten required stock images
          for img in boot.img vendor_boot.img dtbo.img; do
            count=$(find "$STOCK_DIR" -type f -name "$img" 2>/dev/null | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected exactly one '$img' in the Google Drive files, found $count."
              echo "Directory tree of $STOCK_DIR:"
              find "$STOCK_DIR" -maxdepth 3 -ls || true
              exit 1
            fi
            src=$(find "$STOCK_DIR" -type f -name "$img" -print -quit)
            if [ "$src" != "$STOCK_DIR/$img" ]; then
              cp -f "$src" "$STOCK_DIR/$img"
            fi
            echo "  [+] Found $img: $src ($(du -h "$src" | cut -f1))"
          done

          chmod +x "$GITHUB_WORKSPACE/patches/avbtool" 2>/dev/null || true

          echo "[*] Running HyperOS image repack tool..."
          python3 "$GITHUB_WORKSPACE/patches/repack_hyperos_images.py" \
            --stock-dir "$STOCK_DIR" \
            --kernel "$BOOT_DIR/Image" \
            --dtb "$BOOT_DIR/dtb" \
            --out-dir "$OUT_DIR" \
            --avbtool "$GITHUB_WORKSPACE/patches/avbtool"

          (
            cd "$OUT_DIR"
            sha256sum boot.img vendor_boot.img dtbo.img > SHA256SUMS.txt
          )

          echo "✅ HyperOS flashable partitioned images prepared under $OUT_DIR:"
          ls -lh "$OUT_DIR"
          echo "produced=true" >> "$GITHUB_OUTPUT"

      - name: "📦 Upload Build Artifacts"
        id: upload_artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EXTREME++_BMW_Edition_${{ github.run_number }}
          path: |
            kernel/EXTREME++*.zip
            raw_images/*.zip
            hyperos4_images/boot.img
            hyperos4_images/vendor_boot.img
            hyperos4_images/dtbo.img
            hyperos4_images/SHA256SUMS.txt
          if-no-files-found: warn

      - name: "📢 Telegram: HyperOS Images Artifact"
        if: success() && steps.repack.outputs.produced == 'true' && (inputs.target_os == 'hyperos' || inputs.target_os == 'both')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_DM_ID: ${{ secrets.TELEGRAM_DM_ID }}
          ARTIFACT_URL: ${{ steps.upload_artifacts.outputs.artifact-url }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_DM_ID:-}" ]; then
            echo "ℹ️ TELEGRAM_DM_ID is not set. Skipping artifact link DM."
            exit 0
          fi
          if [ ! -f "$GITHUB_WORKSPACE/hyperos4_images/boot.img" ]; then
            echo "ℹ️ HyperOS flashable images were not produced; skipping artifact DM."
            exit 0
          fi
          ARTIFACT_URL="${ARTIFACT_URL:-https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          MSG=$(printf '🚀 <b>EXTREME++ HyperOS 4 Flashable Images</b> [Build #%s]\n\n📱 <b>Device:</b> POCO F4 (munch)\n🏎️ <b>Edition:</b> BMW Edition [Official Stable]\n\n📦 Download partitioned flashable images (<b>boot.img</b>, <b>vendor_boot.img</b>, <b>dtbo.img</b>, <b>SHA256SUMS.txt</b>) from the workflow artifact:\n👉 %s\n\n📁 <b>Artifact Name:</b> EXTREME++_BMW_Edition_%s' \
            "${GITHUB_RUN_NUMBER}" "${ARTIFACT_URL}" "${GITHUB_RUN_NUMBER}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_DM_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" >/dev/null || true

      - name: "📱 Fetch Official EKM Companion App APK"
        if: success()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_assets"
          echo "[*] Fetching latest EKM APK from PandeyJI-9/extreme-kernel-manager..."
          EKM_APK_URL=$(curl -s https://api.github.com/repos/PandeyJI-9/extreme-kernel-manager/releases/latest | grep "browser_download_url.*apk" | cut -d : -f 2,3 | tr -d ' "' || true)
          if [ -n "$EKM_APK_URL" ]; then
            echo "[+] Downloading from: $EKM_APK_URL"
            curl -L "$EKM_APK_URL" -o "$GITHUB_WORKSPACE/release_assets/EKM-Extreme-Kernel-Manager.apk"
          fi
          if [ ! -f "$GITHUB_WORKSPACE/release_assets/EKM-Extreme-Kernel-Manager.apk" ]; then
            echo "[*] Fallback: downloading stable v2.1.0 release APK..."
            curl -L "https://github.com/PandeyJI-9/extreme-kernel-manager/releases/download/v2.1.0/EKM-Extreme-Kernel-Manager-v2.1.0.apk" \
              -o "$GITHUB_WORKSPACE/release_assets/EKM-Extreme-Kernel-Manager.apk" || true
          fi
          echo "✅ EKM Asset prepared:"
          ls -lh "$GITHUB_WORKSPACE/release_assets"

      - name: "📝 Generate Dynamic Release Notes"
        if: success()
        env:
          INPUT_ROOT_MODE: ${{ inputs.root_mode }}
          INPUT_TARGET_OS: ${{ inputs.target_os }}
        run: |
          cat << 'EOF' > "$GITHUB_WORKSPACE/generate_notes.py"
          import os, glob

          root_mode = os.environ.get("INPUT_ROOT_MODE", "ksu_susfs")
          target_os = os.environ.get("INPUT_TARGET_OS", "both")
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "1")

          # 1. Auto-detect Root Variant Description
          root_map = {
              "ksu_susfs": "⚡ **Root Variant:** KowSU Multi-Manager Root (SuSFS v2.3.0 Kernel Stealth)",
              "ksu_no_susfs": "⚡ **Root Variant:** KowSU Multi-Manager Root (Standard Clean KSU / No SuSFS)",
              "noroot": "🛡️ **Architecture:** Pure Clean Base (No Root / No SuSFS)",
              "both": "⚡ **Dual Release:** KowSU + SuSFS v2.3.0 Stealth & Pure Clean Base (No Root)",
              "all": "🚀 **Complete Suite:** All 3 Root Variants (KowSU + SuSFS v2.3.0, Standard Clean KSU, Pure Clean NoRoot)"
          }
          root_desc = root_map.get(root_mode, f"⚡ **Root Variant:** {root_mode}")

          # 2. Auto-detect Target OS Description
          os_map = {
              "hyperos": "🟢 **Xiaomi HyperOS ONLY** (HyperOS 1.0 — 4.0 | Android 14 — 17)",
              "aosp": "⚡ **AOSP Custom ROMs ONLY** (Android 13 — 17 | A15, A16, A17 Tested)",
              "both": "🎯 **Dual Target:** Xiaomi HyperOS (1.0 — 4.0) + AOSP Custom ROMs (Android 13 — 17)"
          }
          os_desc = os_map.get(target_os, target_os)

          # 3. Auto-detect Actual Compiled ZIP Packages
          zips = sorted(glob.glob("kernel/EXTREME++*.zip"))
          pkg_lines = []
          for z in zips:
              bname = os.path.basename(z)
              tag = ""
              if "HyperOS" in bname:
                  tag = "HyperOS"
              elif "AOSP" in bname:
                  tag = "AOSP"
              
              if "KowSU_SuSFS" in bname:
                  tag += " · KowSU + SuSFS v2.3.0"
              elif "KowSU_NoSuSFS" in bname:
                  tag += " · Standard Clean KSU"
              elif "NoRoot" in bname:
                  tag += " · Pure Clean NoRoot"
              elif "KowSU" in bname:
                  tag += " · KowSU Root"
              pkg_lines.append(f"* 📦 **`{bname}`** ({tag})")

          if os.path.exists("release_assets/EKM-Extreme-Kernel-Manager.apk"):
              pkg_lines.append("* 📱 **`EKM-Extreme-Kernel-Manager.apk`** (Official Companion App · BMW M-Power UI)")

          packages_block = "\n".join(pkg_lines) if pkg_lines else "* *No packages detected*"

          notes = f"""# 🏎️💨 PROJECT EXTREME++ (BMW EDITION) — OFFICIAL STABLE RELEASE
          ### Flagship Silicon-Level Performance & Thermal Architecture for POCO F4 (`munch`)

          **Linux 4.19.325-cip135-st19 · Qualcomm Snapdragon 870 5G (`SM8250-AC`) · Built with ZyC-Clang 16 + LLD**

          ---

          ### 📱 Build Configuration (Auto-Detected):
          * {os_desc}
          * {root_desc}
          * 🏷️ **Build Number:** #{run_number}
          * 🟢 **Release Status:** Official Stable · Production Ready

          ---

          ### 📦 Built Packages in this Release:
          {packages_block}

          ---

          ### 🛡️ Root Variants Guide (Which one should you flash?):
          * ⚡ **`KowSU_SuSFS`**: Includes KowSU/ReSukiSU + SuSFS v2.3.0. **Recommended for most rooted users!** Full root capabilities with advanced kernel stealth (kstat spoofing, mount hiding, path hiding, SUS map) to easily pass Play Integrity & banking security.
          * ⚡ **`KowSU_NoSuSFS`**: Standard clean KernelSU root without SuSFS stealth hooks.
          * 🛡️ **`NoRoot`**: 100% clean non-rooted kernel. Zero root binaries or hooks in the kernel tree. Ideal for users wanting maximum battery/stock stability and banking app compatibility without root managers.

          ---

          ### ⚡ Key Silicon & Kernel Features:
          * 🧠 **Native EXTREME+ Governor:** Built directly on Qualcomm CAF WALT Schedutil engine. Active from boot with zero floor locking.
          * 🎛️ **Dynamic In-Kernel Profiles (`/sys/kernel/extreme_profile`):**
            * `0` ➔ 🚀 **Gaming (3.19 GHz Prime Monster / 2.42 GHz Gold)** — Locked 120 FPS
            * `1` ➔ ⚖️ **Balanced (2.84 GHz Prime / 2.25 GHz Gold)** — Sustained 90 FPS & daily efficiency
            * `2` ➔ 🔋 **Battery (2.42 GHz Prime / 1.96 GHz Gold)** — All-day marathon battery
          * 📱 **Official EKM Companion App Attached:** Extreme Kernel Manager APK included above with 1-click profiles & Munch AMOLED DC Dimming!
          * 🎮 **FakeDreamer Adreno 650 GPU Undervolt:** 7 calibrated OPP states (150MHz–670MHz) with DDR Bus Tier 11 (3°C–5°C cooler gaming).
          * 💾 **Next-Gen Memory:** ZSTD Level-3 ZRAM + Google ACK Critical VMScan Anti-Stutter (SurfaceFlinger bypass).
          * 🔋 **Hardware Bypass Charging:** Power motherboard directly via `input_suspend` without heating battery + 67W Mi Turbo + Universal PD/PPS.
          * 📱 **Millet Dual-ABI Netlink Engine:** Fixes 9-sec crash loop, enables genuine deep sleep on HyperOS (compiled out on AOSP for zero bloat).
          * 🌐 **Low-Latency Gaming Net:** TCP BBR default congestion control + FQ/FQ-CoDel pacing.

          ---

          ### 📲 Flashing & Installation:
          1. Boot into Custom Recovery (OrangeFox / TWRP).
          2. Flash the ZIP matching your ROM (`HyperOS` or `AOSP`) and desired Root variant.
          3. The installer automatically flashes the kernel Image, injects the undervolted GPU DTB to `vendor_boot`, and auto-purges old conflicting `/data/adb` scripts.
          4. Reboot & Enjoy!

          ---
          👑 **Maintainer:** PandeyJi ([@pandey_ji_8](https://t.me/pandey_ji_8))  
          💬 **Telegram Support Community:** https://t.me/Extremeplus_Support
          """

          with open(os.environ["GITHUB_WORKSPACE"] + "/release_notes.md", "w") as f:
              f.write(notes)
          print("✅ Generated dynamic release_notes.md")
          EOF

          python3 "$GITHUB_WORKSPACE/generate_notes.py"

      - name: "🚀 Publish Official GitHub Release"
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "BMW-Edition-Build-${{ github.run_number }}"
          name: "EXTREME++ BMW Edition - Official Stable (Build #${{ github.run_number }})"
          body_path: release_notes.md
          files: |
            kernel/EXTREME++*.zip
            release_assets/EKM-*.apk
          draft: false
          prerelease: false

      - name: "📢 Telegram: Official Release Broadcast"
        if: success()
        run: |
          ROOT_DESC="⚡ <b>Root:</b> KowSU Multi-Manager Root (SuSFS v2.3.0)"
          if [ "${{ inputs.root_mode }}" = "noroot" ]; then
            ROOT_DESC="🛡️ <b>Root:</b> Pure Clean Base (No Root)"
          elif [ "${{ inputs.root_mode }}" = "ksu_no_susfs" ]; then
            ROOT_DESC="⚡ <b>Root:</b> KowSU Multi-Manager (Standard Clean KSU / No SuSFS)"
          elif [ "${{ inputs.root_mode }}" = "both" ]; then
            ROOT_DESC="⚡ <b>Root Variants:</b> KowSU Multi-Manager (SuSFS v2.3.0) + Pure Clean Base (No Root)"
          elif [ "${{ inputs.root_mode }}" = "all" ]; then
            ROOT_DESC="🚀 <b>Root Variants:</b> All 3 (KowSU + SuSFS v2.3.0, KowSU Standard KSU, Pure Clean)"
          fi

          MSG=$(printf '🔥 <b>EXTREME++ BMW Edition [Official Stable] Release #%s</b>\n\n📱 <b>Device:</b> POCO F4 (munch)\n🏎️ <b>Edition:</b> EXTREME++ Gaming (BMW Edition)\n🛠️ <b>Toolchain:</b> ZyC-Clang 16.0.6 + LLD\n👑 <b>Author:</b> Extreme++ by @pandey_ji_8\n%s\n\n✨ <b>Dynamic In-Kernel Profiles (/sys/kernel/extreme_profile):</b>\n• 🚀 <b>Gaming [0]:</b> 3.19GHz Prime Monster + 2.42GHz Gold (Peak 120 FPS)\n• ⚖️ <b>Balanced [1]:</b> 2.84GHz Prime Sweet-Spot + 2.25GHz Gold (Zero Heat 90 FPS)\n• 🔋 <b>Battery [2]:</b> 2.42GHz Prime Marathon + 1.96GHz Gold (All-Day SOT)\n\n📦 <i>Uploading flashable ZIP packages and EKM Companion App below...</i>' \
            "${{ github.run_number }}" "${ROOT_DESC}")

          TARGETS=()
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_CHAT_ID }}")
          [ -n "${{ secrets.TELEGRAM_DM_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_DM_ID }}")

          for chat in "${TARGETS[@]}"; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              --data-urlencode "chat_id=$chat" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=$MSG" || true
          done

          for z in $(find "$GITHUB_WORKSPACE/kernel" -maxdepth 1 -name "EXTREME++*.zip" | sort); do
            echo "Uploading $z to Telegram..."
            BNAME=$(basename "$z")
            if [[ "$BNAME" == *"HyperOS"* ]]; then
              TARGET_TAG="⚡ <b>Target ROM:</b> Xiaomi HyperOS / HyperOS 4 (Android 13–17)"
            elif [[ "$BNAME" == *"AOSP"* ]]; then
              TARGET_TAG="⚡ <b>Target ROM:</b> AOSP Custom ROMs (Android 13–17 / A16 & A17 Tested)"
            else
              TARGET_TAG="⚡ <b>Target ROM:</b> POCO F4 (munch)"
            fi

            if [[ "$BNAME" == *"KowSU_SuSFS"* ]]; then
              VARIANT_TAG="⚡ <b>Variant:</b> KowSU Multi-Manager Root (SuSFS v2.3.0)"
            elif [[ "$BNAME" == *"KowSU_NoSuSFS"* ]]; then
              VARIANT_TAG="⚡ <b>Variant:</b> KowSU Multi-Manager Root (Standard Clean KSU / No SuSFS)"
            elif [[ "$BNAME" == *"NoRoot"* ]]; then
              VARIANT_TAG="🛡️ <b>Variant:</b> Pure Clean Base (No Root / No SuSFS)"
            elif [[ "$BNAME" == *"KowSU"* ]]; then
              VARIANT_TAG="⚡ <b>Variant:</b> KowSU Multi-Manager Root"
            else
              VARIANT_TAG=""
            fi

            if [ -n "${VARIANT_TAG}" ]; then
              ZIP_CAPTION=$(printf '📦 <b>%s</b>\n%s\n%s\n👑 Extreme++ BMW Edition by @pandey_ji_8' "${BNAME}" "${TARGET_TAG}" "${VARIANT_TAG}")
            else
              ZIP_CAPTION=$(printf '📦 <b>%s</b>\n%s\n👑 Extreme++ BMW Edition by @pandey_ji_8' "${BNAME}" "${TARGET_TAG}")
            fi

            for chat in "${TARGETS[@]}"; do
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                -F "chat_id=$chat" \
                -F "document=@$z" \
                -F "caption=$ZIP_CAPTION" \
                -F "parse_mode=HTML" || true
            done
          done

          # Also upload EKM Companion App APK to Telegram!
          for apk in $(find "$GITHUB_WORKSPACE/release_assets" -name "EKM-*.apk" 2>/dev/null); do
            echo "Uploading EKM APK $apk to Telegram..."
            ANAME=$(basename "$apk")
            APK_CAPTION=$(printf '📱 <b>%s</b>\n🏎️ Extreme Kernel Manager (EKM) Official Companion App\n🎛️ Live In-Kernel Profile Switcher (Gaming / Balanced / Battery)\n🌙 POCO F4 Munch AMOLED DC Dimming + QS Tile\n👑 Extreme++ BMW Edition by @pandey_ji_8' "${ANAME}")
            for chat in "${TARGETS[@]}"; do
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                -F "chat_id=$chat" \
                -F "document=@$apk" \
                -F "caption=$APK_CAPTION" \
                -F "parse_mode=HTML" || true
            done
          done

      - name: "📢 Telegram: Build Failed"
        if: failure()
        run: |
          TARGETS=()
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_CHAT_ID }}")
          [ -n "${{ secrets.TELEGRAM_DM_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_DM_ID }}")

          FAIL_MSG=$(printf '❌ <b>EXTREME++ Build #%s FAILED!</b>\nPlease check GitHub Actions workflow logs.' "${{ github.run_number }}")
          # Dedupe: DM_ID and CHAT_ID are often the same value.
          mapfile -t TARGETS < <(printf '%s\n' "${TARGETS[@]}" | awk 'NF && !seen[$0]++')
          for chat in "${TARGETS[@]}"; do
            RESP=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              --data-urlencode "chat_id=$chat" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=$FAIL_MSG" || true)
            if ! grep -q '"ok":true' <<<"$RESP"; then
              DESC=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("description","unknown error"))' <<<"$RESP" 2>/dev/null || echo "unreachable")
              echo "::warning::Telegram failure notice to $chat not delivered: $DESC"
            fi
          done
