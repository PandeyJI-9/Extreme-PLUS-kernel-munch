# ╔══════════════════════════════════════════════════════════════╗
# ║  EXTREME++HyperOS — MASTER BUILD PIPELINE                    ║
# ║  POCO F4 (munch) | SM8250-AC | Snapdragon 870               ║
# ║  Maintainer: PandeyJI-9                                     ║
# ╚══════════════════════════════════════════════════════════════╝
name: "🔥 EXTREME++ Build & Release"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v3.0-extreme)"
        required: true
        default: "Beta-1.0"
      inject_sukisu:
        description: "Inject SukiSU Ultra (root)?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  KERNEL_REPO: "https://github.com/AstideLabs/android_kernel_xiaomi_sm8250"
  KERNEL_BRANCH: "android17-aptusitu"
  CLANG_URL: "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Patch → Build → Release"
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: "📢 Telegram: Build Started"
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ] && exit 0
          TEXT=$(cat << 'MSGEOF'
          🚧 <b>EXTREME++HyperOS Build Started!</b> 🚧
          📱 Device: POCO F4 (munch)
          🏷 Tag: <code>${{ inputs.release_tag }}</code>
          MSGEOF
          )
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" -d text="${TEXT}"

      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3

      - name: "⚡ Setup ZyC-Clang 16 Toolchain"
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          wget -qO /tmp/clang.tar.gz "$CLANG_URL"
          tar -zxvf /tmp/clang.tar.gz
          echo "$HOME/zyc-clang/bin" >> $GITHUB_PATH

      - name: "🌐 Clone kernel source"
        run: |
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          echo "UPSTREAM_SHA=$(git -C kernel rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: "🔑 Inject SukiSU Ultra"
        if: inputs.inject_sukisu == 'true'
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          echo "SUKISU=true" >> $GITHUB_ENV

      - name: "🩹 Apply EXTREME++ patches (CPU/GPU)"
        run: |
          chmod +x config-repo/patches/apply-all.sh
          bash config-repo/patches/apply-all.sh kernel || echo "No patches found or applied"

      - name: "🔨 Compile kernel using dev script (Fixing Root)"
        working-directory: kernel
        run: |
          chmod +x build_kernel.sh
          # Passing 'ksu' explicitly to the developer's script to enable KernelSU support!
          if [ "${{ inputs.inject_sukisu }}" == "true" ]; then
            echo "Compiling with SukiSU enabled..."
            ./build_kernel.sh munch ksu miui
          else
            echo "Compiling without Root..."
            ./build_kernel.sh munch miui
          fi

      - name: "📦 Package AnyKernel3 ZIP (Fixing DTBO Path)"
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cat > ak3/anykernel.sh << 'AKEOF'
          properties() { '
          kernel.string=EXTREME++HyperOS Kernel by PandeyJI-9
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          device.name1=munch
          device.name2=POCO F4
          supported.versions=13-17
          '; }
          
          # Setting explicit path for BOOT
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          
          # Explicitly flash dtbo if present
          if [ -f dtbo.img ]; then
            ui_print "- Flashing DTBO for Extreme Frequencies & UV...";
            flash_dtbo;
          fi
          AKEOF
          
          # Force AnyKernel to use the correct dtbo partition path via script modification to avoid TWRP Error 1
          sed -i 's/flash_dtbo;/block=\/dev\/block\/bootdevice\/by-name\/dtbo;\n  flash_dtbo;/g' ak3/anykernel.sh
          
          echo "🔍 Searching for compiled kernel image..."
          IMAGE_PATH=$(find kernel -type f \( -name "Image" -o -name "Image.gz" \) | grep "arch/arm64/boot" | head -n 1)
          if [ -z "$IMAGE_PATH" ]; then
            IMAGE_PATH=$(find kernel -type f \( -name "Image" -o -name "Image.gz" \) | head -n 1)
          fi
          
          if [ -n "$IMAGE_PATH" ]; then
            echo "✅ Found Kernel Image at: $IMAGE_PATH"
            cp "$IMAGE_PATH" ak3/
          else
            echo "❌ ERROR: Kernel Image not found! Build script might have failed."
            exit 1
          fi
          
          echo "🔍 Searching for dtbo.img..."
          DTBO_PATH=$(find kernel -type f -name "dtbo.img" | head -n 1)
          if [ -n "$DTBO_PATH" ]; then
            echo "✅ Found DTBO at: $DTBO_PATH"
            cp "$DTBO_PATH" ak3/dtbo.img
          fi

          STAG=""
          [ "${SUKISU:-}" = "true" ] && STAG="-SukiSU"
          ZIP="EXTREME++HyperOS-munch-${{ inputs.release_tag }}${STAG}.zip"
          cd ak3 && zip -r9 "../${ZIP}" . -x "*.git*"
          echo "ZIP_PATH=${GITHUB_WORKSPACE}/${ZIP}" >> $GITHUB_ENV
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV

      - name: "🚀 Create GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" "$ZIP_PATH" \
            --repo "${{ github.repository }}" \
            --title "EXTREME++HyperOS ${{ inputs.release_tag }} | POCO F4 (munch)" \
            --notes "Safe HyperOS 3 Kernel with CPU 2.8GHz, GPU 150MHz UV, and SukiSU."

      - name: "📢 Telegram: Build Success"
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ] && exit 0
          DL="https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}"
          TEXT=$(cat << EOF
          ⚡ <b>EXTREME++HyperOS Kernel</b> — <code>${{ inputs.release_tag }}</code>

          📱 Device: POCO F4 (munch)
          🏷 Base: HyperOS 3
          🎮 GPU: Extreme Frequencies + UV
          🏎 CPU: Capped
          🔑 Root: SukiSU Ultra

          📥 <a href="${DL}">Download ZIP</a>
          EOF
          )
          MSG_RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
            -d text="${TEXT}")
            
          MSG_ID=$(echo "$MSG_RESPONSE" | grep -o '"message_id":[0-9]*' | cut -d: -f2)
          
          if [ -f "$ZIP_PATH" ] && [ -n "$MSG_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"$ZIP_PATH" \
              -F reply_to_message_id="$MSG_ID" \
              -F caption="📦 Flashable ZIP: ${ZIP_NAME}"
          elif [ -f "$ZIP_PATH" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"$ZIP_PATH" \
              -F caption="📦 Flashable ZIP: ${ZIP_NAME}"
          fi
