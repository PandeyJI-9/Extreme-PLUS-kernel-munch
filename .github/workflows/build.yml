name: "🚀 Build EXTREME++ Kernel (BMW Edition - Dynamic Profiles)"

on:
  workflow_dispatch:
    inputs:
      root_mode:
        description: 'Root Variant: ksu_susfs (SuSFS v2.3.0) | ksu_no_susfs (Standard KSU) | noroot (Pure Clean) | all'
        required: true
        type: choice
        default: 'ksu_susfs'
        options:
          - 'ksu_susfs'
          - 'ksu_no_susfs'
          - 'noroot'
          - 'all'
          - 'both'
      target_os:
        description: 'Target OS: both | hyperos | aosp'
        required: true
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'hyperos'
          - 'aosp'
jobs:
  build:
    name: "Compile → Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 180 

    steps:
      - name: "📢 Telegram: Build Started"
        continue-on-error: true
        run: |
          TARGETS=()
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_CHAT_ID }}")
          [ -n "${{ secrets.TELEGRAM_DM_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_DM_ID }}")

          ROOT_LABEL="⚡ Root: KowSU Multi-Manager Root (SuSFS v2.3.0)"
          if [ "${{ inputs.root_mode }}" = "noroot" ]; then
            ROOT_LABEL="🛡️ Architecture: Pure Clean Base (No Root)"
          elif [ "${{ inputs.root_mode }}" = "ksu_no_susfs" ]; then
            ROOT_LABEL="⚡ Root: KowSU Multi-Manager (Standard Clean KSU / No SuSFS)"
          elif [ "${{ inputs.root_mode }}" = "both" ]; then
            ROOT_LABEL="⚡ Dual Release: KowSU + SuSFS v2.3.0 & Pure Clean Base (No Root)"
          elif [ "${{ inputs.root_mode }}" = "all" ]; then
            ROOT_LABEL="🚀 Complete Suite: KowSU + SuSFS, KowSU Standard KSU, and Pure Clean Base"
          fi

          TARGET_LABEL="Dual Target: HyperOS 4 + AOSP (A16 & A17)"
          if [ "${{ inputs.target_os }}" = "hyperos" ]; then
            TARGET_LABEL="Xiaomi HyperOS / HyperOS 4 ONLY"
          elif [ "${{ inputs.target_os }}" = "aosp" ]; then
            TARGET_LABEL="AOSP ONLY (Android 13–17 / A16 & A17 Tested)"
          fi

          for chat in "${TARGETS[@]}"; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d chat_id="$chat" \
              -d text="🚀 <b>EXTREME++ Build Started!</b>%0A📱 Device: POCO F4 (munch)%0A🏎️ Edition: EXTREME++ Gaming (BMW Edition)%0A🎯 Target: ${TARGET_LABEL}%0A${ROOT_LABEL}%0A⚡ Default Clock: 3.19 GHz Unlocked Peak (Dynamic Profiles)" -d parse_mode="HTML" || true
          done

      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone kernel source"
        run: |
          if git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel 2>/dev/null; then
            echo "[+] Cloned android17-aptusitu branch"
          else
            echo "[*] Falling back to verified SuSFS v2.3.0 tree (refs/pull/74/merge)..."
            mkdir kernel && cd kernel
            git init
            git remote add origin https://github.com/AstideLabs/android_kernel_xiaomi_sm8250
            git fetch --depth=1 origin refs/pull/74/merge
            git checkout FETCH_HEAD
            cd ..
          fi

      - name: "⚙️ Inject PandeyJI Custom Build Script"
        run: |
          cp patches/* kernel/
          chmod +x kernel/build_kernel.sh

      # 🔥 FIX 2: THE MASTER ZRAM/SWAP HACK (Fixed for GitHub OverlayFS)
      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Checking current RAM..."
          free -h
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "[*] New RAM Capacity:"
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        run: |
          cd kernel
          ./build_kernel.sh munch "${{ inputs.root_mode }}" "${{ inputs.target_os }}"
          
          echo "✅ Built ZIP files:"
          ls -lh EXTREME++*.zip

      - name: "📦 Package Raw Kernel Images for HyperOS 4 (.img / dtb)"
        if: success()
        run: |
          echo "[*] Checking for HyperOS raw images (.img / dtb) for HyperOS 4 developer testing..."
          IMG_DIR="$GITHUB_WORKSPACE/raw_kernel_images_staging"
          OUT_ZIP_DIR="$GITHUB_WORKSPACE/raw_images"
          mkdir -p "$IMG_DIR" "$OUT_ZIP_DIR"

          # HyperOS output directory only. Never fall back to AOSP output.
          HYPEROS_BOOT="$GITHUB_WORKSPACE/kernel/out_hyperos/arch/arm64/boot"

          if [ -d "$HYPEROS_BOOT" ] && [ -f "$HYPEROS_BOOT/Image" ]; then
            # 1. Main Kernel Binary (do not call this boot.img)
            cp -f "$HYPEROS_BOOT/Image" "$IMG_DIR/Image"
            echo "  [+] Included Image from $HYPEROS_BOOT/Image ($(du -h "$IMG_DIR/Image" | cut -f1))"

            # 2. DTBO Image
            if [ -f "$HYPEROS_BOOT/dtbo.img" ]; then
              cp -f "$HYPEROS_BOOT/dtbo.img" "$IMG_DIR/dtbo.img"
              echo "  [+] Included dtbo.img from $HYPEROS_BOOT/dtbo.img"
            fi

            # 3. DTB Blob / Table
            if [ -f "$HYPEROS_BOOT/dtb" ]; then
              cp -f "$HYPEROS_BOOT/dtb" "$IMG_DIR/dtb"
              cp -f "$HYPEROS_BOOT/dtb" "$IMG_DIR/dtb.img"
              echo "  [+] Included dtb & dtb.img from $HYPEROS_BOOT/dtb"
            elif [ -f "$HYPEROS_BOOT/dtb.img" ]; then
              cp -f "$HYPEROS_BOOT/dtb.img" "$IMG_DIR/dtb.img"
              cp -f "$HYPEROS_BOOT/dtb.img" "$IMG_DIR/dtb"
              echo "  [+] Included dtb.img from $HYPEROS_BOOT/dtb.img"
            fi

            # 4. Any other *.img files
            find "$HYPEROS_BOOT" -maxdepth 1 -name "*.img" -exec cp -f {} "$IMG_DIR/" \; 2>/dev/null || true

            # 5. Compress into a clean, lossless ZIP package
            RAW_ZIP_NAME="EXTREME++_HyperOS4_Raw_Images_Build_${{ github.run_number }}.zip"
            (
              cd "$IMG_DIR"
              zip -9 -r "$OUT_ZIP_DIR/$RAW_ZIP_NAME" ./*
            )
            rm -rf "$IMG_DIR"

            echo "✅ Created HyperOS 4 Raw Images ZIP: $OUT_ZIP_DIR/$RAW_ZIP_NAME ($(du -h "$OUT_ZIP_DIR/$RAW_ZIP_NAME" | cut -f1))"
            echo "RAW_IMAGES_ZIP_PATH=$OUT_ZIP_DIR/$RAW_ZIP_NAME" >> $GITHUB_ENV
            echo "RAW_IMAGES_ZIP_NAME=$RAW_ZIP_NAME" >> $GITHUB_ENV
          else
            echo "ℹ️ HyperOS output not found (e.g. only AOSP was requested). Skipping HyperOS raw images zip."
          fi

      - name: "🔐 Repack HyperOS images from Google Drive"
        if: success() && (inputs.target_os == 'hyperos' || inputs.target_os == 'both')
        continue-on-error: true
        env:
          HYPEROSIMGS_URL: ${{ secrets.hyperosimgs }}
        run: |
          set -euo pipefail

          if [ -z "${HYPEROSIMGS_URL:-}" ]; then
            echo "ℹ️ Google Drive folder secret 'hyperosimgs' is not set. Skipping HyperOS images repack."
            exit 0
          fi

          BOOT_DIR="$GITHUB_WORKSPACE/kernel/out_hyperos/arch/arm64/boot"
          if [ ! -d "$BOOT_DIR" ]; then
            BOOT_DIR="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          fi

          if [ ! -f "$BOOT_DIR/Image" ]; then
            echo "::warning::HyperOS Image not found in $BOOT_DIR. Skipping repack."
            exit 0
          fi

          # Ensure dtb is available
          if [ ! -f "$BOOT_DIR/dtb" ]; then
            if [ -f "$BOOT_DIR/dtb.img" ]; then
              cp -f "$BOOT_DIR/dtb.img" "$BOOT_DIR/dtb"
            elif ls "$BOOT_DIR"/dts/vendor/qcom/*.dtb >/dev/null 2>&1; then
              cat "$BOOT_DIR"/dts/vendor/qcom/*.dtb > "$BOOT_DIR/dtb"
            fi
          fi

          if [ ! -f "$BOOT_DIR/dtb" ]; then
            echo "::warning::HyperOS dtb not found in $BOOT_DIR. Skipping repack."
            exit 0
          fi

          STOCK_DIR="$GITHUB_WORKSPACE/hyperos4_stock"
          OUT_DIR="$GITHUB_WORKSPACE/hyperos4_images"
          rm -rf "$STOCK_DIR" "$OUT_DIR"
          mkdir -p "$STOCK_DIR" "$OUT_DIR"

          python3 -m pip install --user --upgrade gdown cryptography
          export STOCK_DIR
          python3 - <<'PY'
          import os
          import gdown

          url = os.environ["HYPEROSIMGS_URL"].strip()
          if not url.startswith(("http://", "https://")):
              url = f"https://drive.google.com/drive/folders/{url}"

          try:
              gdown.download_folder(
                  url=url,
                  output=os.environ["STOCK_DIR"],
                  quiet=False,
                  use_cookies=False,
                  remaining_ok=True,
              )
          except Exception as exc:
              print(f"Warning: gdown download failed: {exc}")
          PY

          for img in boot.img vendor_boot.img dtbo.img; do
            count=$(find "$STOCK_DIR" -type f -name "$img" 2>/dev/null | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::warning::Expected exactly one $img in the Google Drive folder, found $count. Skipping repack."
              exit 0
            fi
            src=$(find "$STOCK_DIR" -type f -name "$img" -print -quit)
            if [ "$src" != "$STOCK_DIR/$img" ]; then
              cp -f "$src" "$STOCK_DIR/$img"
            fi
          done

          chmod +x "$GITHUB_WORKSPACE/patches/avbtool" 2>/dev/null || true

          python3 "$GITHUB_WORKSPACE/patches/repack_hyperos_images.py" \
            --stock-dir "$STOCK_DIR" \
            --kernel "$BOOT_DIR/Image" \
            --dtb "$BOOT_DIR/dtb" \
            --out-dir "$OUT_DIR" \
            --avbtool "$GITHUB_WORKSPACE/patches/avbtool"

          (
            cd "$OUT_DIR"
            sha256sum boot.img vendor_boot.img dtbo.img > SHA256SUMS.txt
          )

          echo "✅ HyperOS images prepared under $OUT_DIR"

      - name: "📦 Upload Build Artifacts"
        id: upload_artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EXTREME++_BMW_Edition_BETA_${{ github.run_number }}
          path: |
            kernel/EXTREME++*.zip
            raw_images/*.zip
            hyperos4_images/boot.img
            hyperos4_images/vendor_boot.img
            hyperos4_images/dtbo.img
            hyperos4_images/SHA256SUMS.txt
          if-no-files-found: warn

      - name: "📢 Telegram: HyperOS Images Artifact"
        if: success() && (inputs.target_os == 'hyperos' || inputs.target_os == 'both')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_DM_ID: ${{ secrets.TELEGRAM_DM_ID }}
          ARTIFACT_URL: ${{ steps.upload_artifacts.outputs['artifact-url'] }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_DM_ID:-}" ]; then
            echo "ℹ️ TELEGRAM_DM_ID is not set. Skipping artifact link DM."
            exit 0
          fi
          if [ ! -f "$GITHUB_WORKSPACE/hyperos4_images/boot.img" ]; then
            echo "ℹ️ HyperOS 4 images not generated. Skipping artifact DM."
            exit 0
          fi
          ARTIFACT_URL="${ARTIFACT_URL:-https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          MSG=$(printf 'EXTREME++ HyperOS 4 images - build #%s\n\nDownload boot.img, vendor_boot.img, dtbo.img and SHA256SUMS.txt from the workflow artifact:\n%s\n\nArtifact name: EXTREME++_BMW_Edition_BETA_%s' \
            "${GITHUB_RUN_NUMBER}" "${ARTIFACT_URL}" "${GITHUB_RUN_NUMBER}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_DM_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null || true

      - name: "📢 Telegram: Official Release Broadcast"
        if: success()
        run: |
          ROOT_DESC="⚡ <b>Root:</b> KowSU Multi-Manager Root (SuSFS v2.3.0)"
          if [ "${{ inputs.root_mode }}" = "noroot" ]; then
            ROOT_DESC="🛡️ <b>Root:</b> Pure Clean Base (No Root)"
          elif [ "${{ inputs.root_mode }}" = "ksu_no_susfs" ]; then
            ROOT_DESC="⚡ <b>Root:</b> KowSU Multi-Manager (Standard Clean KSU / No SuSFS)"
          elif [ "${{ inputs.root_mode }}" = "both" ]; then
            ROOT_DESC="⚡ <b>Root Variants:</b> KowSU Multi-Manager (SuSFS v2.3.0) + Pure Clean Base (No Root)"
          elif [ "${{ inputs.root_mode }}" = "all" ]; then
            ROOT_DESC="🚀 <b>Root Variants:</b> All 3 (KowSU + SuSFS v2.3.0, KowSU Standard KSU, Pure Clean)"
          fi

          MSG="🔥 <b>EXTREME++ BMW Edition [BETA] Release #${{ github.run_number }}</b>%0A%0A"
          MSG="${MSG}📱 <b>Device:</b> POCO F4 (munch)%0A"
          MSG="${MSG}🏎️ <b>Edition:</b> EXTREME++ Gaming (BMW Edition [BETA])%0A"
          MSG="${MSG}🛠️ <b>Toolchain:</b> ZyC-Clang 16.0.6 + LLD%0A"
          MSG="${MSG}👑 <b>Author:</b> Extreme++ by @pandey_ji_8%0A"
          MSG="${MSG}${ROOT_DESC}%0A%0A"
          MSG="${MSG}✨ <b>Dynamic In-Kernel Profiles (/sys/kernel/extreme_profile):</b>%0A"
          MSG="${MSG}• 🚀 <b>Gaming [0]:</b> 3.19GHz Prime Monster + 2.42GHz Gold (Peak 120 FPS)%0A"
          MSG="${MSG}• ⚖️ <b>Balanced [1]:</b> 2.84GHz Prime Sweet-Spot + 2.25GHz Gold (Zero Heat 90 FPS)%0A"
          MSG="${MSG}• 🔋 <b>Battery [2]:</b> 2.42GHz Prime Marathon + 1.96GHz Gold (All-Day SOT)%0A%0A"
          MSG="${MSG}📦 <i>Uploading flashable ZIP packages below...</i>"

          TARGETS=()
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_CHAT_ID }}")
          [ -n "${{ secrets.TELEGRAM_DM_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_DM_ID }}")

          for chat in "${TARGETS[@]}"; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d chat_id="$chat" \
              -d text="$MSG" \
              -d parse_mode="HTML" || true
          done

          for z in $(find "$GITHUB_WORKSPACE/kernel" -maxdepth 1 -name "EXTREME++*.zip" | sort); do
            echo "Uploading $z to Telegram..."
            BNAME=$(basename "$z")
            if [[ "$BNAME" == *"HyperOS"* ]]; then
              TARGET_TAG="⚡ <b>Target ROM:</b> Xiaomi HyperOS / HyperOS 4 (Android 13–17)"
            elif [[ "$BNAME" == *"AOSP"* ]]; then
              TARGET_TAG="⚡ <b>Target ROM:</b> AOSP Custom ROMs (Android 13–17 / A16 & A17 Tested)"
            else
              TARGET_TAG="⚡ <b>Target ROM:</b> POCO F4 (munch)"
            fi

            if [[ "$BNAME" == *"KowSU_SuSFS"* ]]; then
              VARIANT_TAG="⚡ <b>Variant:</b> KowSU Multi-Manager Root (SuSFS v2.3.0)"
            elif [[ "$BNAME" == *"KowSU_NoSuSFS"* ]]; then
              VARIANT_TAG="⚡ <b>Variant:</b> KowSU Multi-Manager Root (Standard Clean KSU / No SuSFS)"
            elif [[ "$BNAME" == *"NoRoot"* ]]; then
              VARIANT_TAG="🛡️ <b>Variant:</b> Pure Clean Base (No Root / No SuSFS)"
            elif [[ "$BNAME" == *"KowSU"* ]]; then
              VARIANT_TAG="⚡ <b>Variant:</b> KowSU Multi-Manager Root"
            else
              VARIANT_TAG=""
            fi

            ZIP_CAPTION="📦 <b>${BNAME}</b>%0A${TARGET_TAG}%0A${VARIANT_TAG}%0A👑 Extreme++ BMW Edition by @pandey_ji_8"
            for chat in "${TARGETS[@]}"; do
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                -F chat_id="$chat" \
                -F document=@"$z" \
                -F caption="$ZIP_CAPTION" \
                -F parse_mode="HTML" || true
            done
          done

      - name: "📢 Telegram: Build Failed"
        if: failure()
        run: |
          TARGETS=()
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_CHAT_ID }}")
          [ -n "${{ secrets.TELEGRAM_DM_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_DM_ID }}")

          for chat in "${TARGETS[@]}"; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d chat_id="$chat" \
              -d text="❌ <b>EXTREME++ Build #${{ github.run_number }} FAILED!</b>%0APlease check GitHub Actions workflow logs." \
              -d parse_mode="HTML" || true
          done
