name: "🚀 Build EXTREME++ Kernel (BMW Edition - Dynamic Profiles)"

on:
  workflow_dispatch:
    inputs:
      build_ksu:
        description: 'Integrate KowSU (KOWX712 Multi-Manager & SuSFS)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: "Compile → Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 180 

    steps:
      - name: "📢 Telegram: Build Started"
        continue-on-error: true
        run: |
          TARGETS=()
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_CHAT_ID }}")
          [ -n "${{ secrets.TELEGRAM_DM_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_DM_ID }}")

          ROOT_LABEL="🛡️ Architecture: Pure Clean Base (No Root)"
          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            ROOT_LABEL="⚡ Root: Inbuilt Multi-Manager Root (SuSFS v2.3.0)"
          fi

          for chat in "${TARGETS[@]}"; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d chat_id="$chat" \
              -d text="🚀 <b>EXTREME++ Build Started!</b>%0A📱 Device: POCO F4 (munch)%0A🏎️ Edition: EXTREME++ Gaming (BMW Edition)%0A${ROOT_LABEL}%0A⚡ Default Clock: 3.19 GHz Unlocked Peak (Dynamic Profiles)" -d parse_mode="HTML" || true
          done

      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone kernel source"
        run: |
          git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel

      - name: "⚙️ Inject PandeyJI Custom Build Script"
        run: |
          cp patches/* kernel/
          chmod +x kernel/build_kernel.sh

      # 🔥 FIX 2: THE MASTER ZRAM/SWAP HACK (Fixed for GitHub OverlayFS)
      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Checking current RAM..."
          free -h
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "[*] New RAM Capacity:"
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        run: |
          cd kernel
          KSU_MODE="noroot"
          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            KSU_MODE="ksu"
          fi
          ./build_kernel.sh munch "$KSU_MODE"
          
          echo "✅ Built ZIP files:"
          ls -lh EXTREME++*.zip

      - name: "📦 Package Raw Kernel Images (.img / dtb)"
        if: success()
        run: |
          echo "[*] Packaging raw kernel images (.img / dtb) for developer testing..."
          IMG_DIR="$GITHUB_WORKSPACE/raw_kernel_images_staging"
          OUT_ZIP_DIR="$GITHUB_WORKSPACE/raw_images"
          mkdir -p "$IMG_DIR" "$OUT_ZIP_DIR"

          # 1. Main Kernel Binary (Image & kernel.img)
          if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" ]; then
            cp -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" "$IMG_DIR/Image"
            cp -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" "$IMG_DIR/kernel.img"
            echo "  [+] Included Image & kernel.img from kernel/out/arch/arm64/boot/Image ($(du -h "$IMG_DIR/Image" | cut -f1))"
          elif [ -f "$GITHUB_WORKSPACE/kernel/anykernel/Image" ]; then
            cp -f "$GITHUB_WORKSPACE/kernel/anykernel/Image" "$IMG_DIR/Image"
            cp -f "$GITHUB_WORKSPACE/kernel/anykernel/Image" "$IMG_DIR/kernel.img"
            echo "  [+] Included Image & kernel.img from kernel/anykernel/Image ($(du -h "$IMG_DIR/Image" | cut -f1))"
          fi

          # 2. DTBO Image (if built)
          if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtbo.img" ]; then
            cp -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtbo.img" "$IMG_DIR/dtbo.img"
            echo "  [+] Included dtbo.img from kernel/out/arch/arm64/boot/dtbo.img"
          fi

          # 3. DTB Blob / Table (used inside vendor_boot)
          if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtb" ]; then
            cp -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtb" "$IMG_DIR/dtb"
            cp -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtb" "$IMG_DIR/dtb.img"
            echo "  [+] Included dtb & dtb.img from kernel/out/arch/arm64/boot/dtb"
          elif [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtb.img" ]; then
            cp -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtb.img" "$IMG_DIR/dtb.img"
            cp -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtb.img" "$IMG_DIR/dtb"
            echo "  [+] Included dtb.img from kernel/out/arch/arm64/boot/dtb.img"
          elif [ -f "$GITHUB_WORKSPACE/kernel/anykernel/dtb" ]; then
            cp -f "$GITHUB_WORKSPACE/kernel/anykernel/dtb" "$IMG_DIR/dtb"
            cp -f "$GITHUB_WORKSPACE/kernel/anykernel/dtb" "$IMG_DIR/dtb.img"
            echo "  [+] Included dtb from kernel/anykernel/dtb"
          fi

          # 4. Any other *.img files
          find "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot" -maxdepth 1 -name "*.img" -exec cp -f {} "$IMG_DIR/" \; 2>/dev/null || true

          # 5. Compress into a clean, lossless ZIP package (zip -9 lossless deflate)
          RAW_ZIP_NAME="EXTREME++_Raw_Images_Build_${{ github.run_number }}.zip"
          (
            cd "$IMG_DIR"
            zip -9 -r "$OUT_ZIP_DIR/$RAW_ZIP_NAME" ./*
          )
          rm -rf "$IMG_DIR"

          echo "✅ Created Raw Images ZIP: $OUT_ZIP_DIR/$RAW_ZIP_NAME ($(du -h "$OUT_ZIP_DIR/$RAW_ZIP_NAME" | cut -f1))"
          echo "RAW_IMAGES_ZIP_PATH=$OUT_ZIP_DIR/$RAW_ZIP_NAME" >> $GITHUB_ENV
          echo "RAW_IMAGES_ZIP_NAME=$RAW_ZIP_NAME" >> $GITHUB_ENV

      - name: "📦 Upload Build Artifacts"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EXTREME++_BMW_Edition_BETA_${{ github.run_number }}
          path: |
            kernel/EXTREME++*.zip
            raw_images/*.zip
          if-no-files-found: warn

      - name: "📢 Telegram: Official Release Broadcast"
        if: success()
        run: |
          ROOT_DESC="🛡️ <b>Root:</b> Pure Clean Base (No Root)"
          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            ROOT_DESC="⚡ <b>Root:</b> Inbuilt Multi-Manager Root (SuSFS v2.3.0)"
          fi

          MSG="🔥 <b>EXTREME++ BMW Edition [BETA] Release #${{ github.run_number }}</b>%0A%0A"
          MSG="${MSG}📱 <b>Device:</b> POCO F4 (munch)%0A"
          MSG="${MSG}🏎️ <b>Edition:</b> EXTREME++ Gaming (BMW Edition [BETA])%0A"
          MSG="${MSG}⚡ <b>Target ROM:</b> HyperOS / MIUI Android 13–17%0A"
          MSG="${MSG}🛠️ <b>Toolchain:</b> ZyC-Clang 16.0.6 + LLD%0A"
          MSG="${MSG}👑 <b>Author:</b> Extreme++ by @pandey_ji_8%0A"
          MSG="${MSG}${ROOT_DESC}%0A%0A"
          MSG="${MSG}✨ <b>Dynamic In-Kernel Profiles (/sys/kernel/extreme_profile):</b>%0A"
          MSG="${MSG}• 🚀 <b>Gaming [0]:</b> 3.19GHz Prime Monster + 2.42GHz Gold (Peak 120 FPS)%0A"
          MSG="${MSG}• ⚖️ <b>Balanced [1]:</b> 2.84GHz Prime Sweet-Spot + 2.25GHz Gold (Zero Heat 90 FPS)%0A"
          MSG="${MSG}• 🔋 <b>Battery [2]:</b> 2.42GHz Prime Marathon + 1.96GHz Gold (All-Day SOT)%0A%0A"
          MSG="${MSG}📦 <i>Uploading flashable ZIP package below...</i>"

          TARGETS=()
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_CHAT_ID }}")
          [ -n "${{ secrets.TELEGRAM_DM_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_DM_ID }}")

          for chat in "${TARGETS[@]}"; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d chat_id="$chat" \
              -d text="$MSG" \
              -d parse_mode="HTML" || true
          done

          for z in $(find "$GITHUB_WORKSPACE/kernel" -maxdepth 1 -name "EXTREME++*.zip"); do
            echo "Uploading $z to Telegram..."
            for chat in "${TARGETS[@]}"; do
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                -F chat_id="$chat" \
                -F document=@"$z" \
                -F caption="📦 $(basename "$z")" || true
            done
          done

      - name: "🔒 Telegram: Send Raw Images to Developer DM (Private)"
        if: success()
        run: |
          DM_ID="${{ secrets.TELEGRAM_DM_ID }}"
          if [ -z "$DM_ID" ]; then
            echo "ℹ️ TELEGRAM_DM_ID secret is not set. Skipping private DM upload."
            exit 0
          fi

          ZIP_PATH="${{ env.RAW_IMAGES_ZIP_PATH }}"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "⚠️ Raw images ZIP ($ZIP_PATH) not found, skipping DM upload."
            exit 0
          fi

          DM_CAPTION="🛠️ <b>EXTREME++ Kernel Raw Images (.img) Developer Pack</b>%0A%0A"
          DM_CAPTION="${DM_CAPTION}📱 <b>Device:</b> POCO F4 (munch)%0A"
          DM_CAPTION="${DM_CAPTION}🏎️ <b>Edition:</b> BMW Edition (Build #${{ github.run_number }})%0A"
          DM_CAPTION="${DM_CAPTION}📦 <b>Archive:</b> <code>${{ env.RAW_IMAGES_ZIP_NAME }}</code>%0A"
          DM_CAPTION="${DM_CAPTION}📁 <b>Contents:</b> Raw <code>Image</code>, <code>dtb</code>, <code>dtbo.img</code>%0A%0A"
          DM_CAPTION="${DM_CAPTION}🔒 <i>Privately delivered to your DM for testing and fastboot unpacking (NOT sent to group).</i>"

          echo "[*] Sending raw images ZIP exclusively to Telegram DM ($DM_ID)..."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
            -F chat_id="$DM_ID" \
            -F document=@"$ZIP_PATH" \
            -F caption="$DM_CAPTION" \
            -F parse_mode="HTML" || true
          echo "✅ Raw kernel images package successfully dispatched to private DM!"

      - name: "📢 Telegram: Build Failed"
        if: failure()
        run: |
          TARGETS=()
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_CHAT_ID }}")
          [ -n "${{ secrets.TELEGRAM_DM_ID }}" ] && TARGETS+=("${{ secrets.TELEGRAM_DM_ID }}")

          for chat in "${TARGETS[@]}"; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d chat_id="$chat" \
              -d text="❌ <b>EXTREME++ Build #${{ github.run_number }} FAILED!</b>%0APlease check GitHub Actions workflow logs." \
              -d parse_mode="HTML" || true
          done
